function csvCell(v){ v = (v==null?'':String(v)); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function yearReportData(year){
  var rows = [];
  for(var mo=1; mo<=12; mo++){
    var from = year+'-'+pad(mo)+'-01', to = year+'-'+pad(mo)+'-'+pad(new Date(year,mo,0).getDate());
    var recs = recordsInRange(from,to), exps = expensesInRange(from,to);
    var g = sumIncome(recs), nt = sumNetIncome(recs);
    var byCat = {}; allCats().forEach(function(c){ byCat[c.key]=0; });
    exps.forEach(function(e){ byCat[e.category] = (byCat[e.category]||0) + (+e.amount||0); });
    var fix = fixedTotalForRange(from,to);
    rows.push({month:year+'-'+pad(mo), trips:recs.filter(function(r){ return !platformDef(r.platform).tipOnly; }).length,
      gross:g.rev, tip:g.tip, fee:g.total-nt.total, net:nt.total, byCat:byCat, varExp:sumExpense(exps), fixed:fix,
      profit:nt.total-sumExpense(exps)-fix, km:totalKmInRange(from,to), hours:totalHoursInRange(from,to), days:workingDaysInRange(from,to)});
  }
  var plat = {};
  recordsInRange(year+'-01-01', year+'-12-31').forEach(function(r){
    var k = r.platform, p = plat[k] || (plat[k] = {label:platformDef(k).label, trips:0, gross:0, fee:0, net:0});
    if(!platformDef(k).tipOnly) p.trips++;
    var gr = computeGrossRevenue(r)+(+r.tip||0), ne = computeNetRevenue(r)+(+r.tip||0);
    p.gross += gr; p.net += ne; p.fee += gr-ne;
  });
  var bonus = {};
  recordsInRange(year+'-01-01', year+'-12-31').forEach(function(r){
    if(r.platform!=='bonus') return;
    var bk = platformDef(r.bonusPlatform).label+' · '+(r.bonusType||'其他');
    var b = bonus[bk] || (bonus[bk] = {label:bk, n:0, amt:0});
    b.n++; b.amt += (+r.revenue||0);
  });
  return {rows:rows, plat:Object.keys(plat).map(function(k){ return plat[k]; }).sort(function(a,b){ return b.net-a.net; }),
    bonus:Object.keys(bonus).map(function(k){ return bonus[k]; }).sort(function(a,b){ return b.amt-a.amt; })};
}
function yearReportCsv(year){
  var d = yearReportData(year), r2 = function(x){ return Math.round(x); };
  var head = ['月份','營業天數','趟數','車資','小費','平台手續費','實收'].concat(allCats().map(function(c){ return '支出-'+c.label; })).concat(['變動支出合計','固定成本攤提','淨利','里程km','工時(小時)']);
  var lines = [head];
  var tot = null;
  d.rows.forEach(function(r){
    var line = [r.month, r.days, r.trips, r2(r.gross), r2(r.tip), r2(r.fee), r2(r.net)].concat(allCats().map(function(c){ return r2(r.byCat[c.key]||0); })).concat([r2(r.varExp), r2(r.fixed), r2(r.profit), +r.km.toFixed(1), +r.hours.toFixed(2)]);
    lines.push(line);
    tot = tot ? tot.map(function(v,i){ return i===0?v:+(v+line[i]).toFixed(2); }) : ['全年合計'].concat(line.slice(1));
  });
  lines.push(tot);
  lines.push([]);
  lines.push(['平台','趟數','車資(含小費)','平台手續費','實收']);
  d.plat.forEach(function(p){ lines.push([p.label, p.trips, r2(p.gross), r2(p.fee), r2(p.net)]); });
  if(d.bonus.length){
    lines.push([]);
    lines.push(['活動獎勵明細(平台 · 類型)','筆數','金額']);
    d.bonus.forEach(function(b){ lines.push([b.label, b.n, r2(b.amt)]); });

}

var DUP_WINDOW_MS = 2*60000;
// An extra 0 is the commonest typo. With the trip's pickup and drop-off we can say roughly what the meter
// would show (Taiwan meters run about $100 to start and $25 a km; roads are ~1.4x the straight line);
// without them we compare with the driver's own recent fares. Only asks: a real surge or a long trip goes through.
function fareLooksTooHigh(revenue, trip, platformKey){
  if(!(revenue>=500)) return '';
  if(trip && trip.pickup && trip.dropoff){
    var km = straightKm(trip.pickup, trip.dropoff), mins = (trip.dropoff.ts && trip.pickup.ts) ? tripMin(trip.pickup, trip.dropoff) : null;
    var byKm = km!=null ? 100 + km*1.4*25 : 0, byMin = mins!=null && mins>0 ? 85 + mins*15 : 0;
    var est = Math.max(byKm, byMin);
    if(est>0 && revenue > est*3){
      var what = [];
      if(km!=null) what.push('上下車直線距離約 '+fmtNum(km,1)+' 公里');
      if(mins!=null && mins>0) what.push('搭乘 '+Math.round(mins)+' 分鐘');
      return '這趟'+what.join('、')+',粗估的參考範圍大約 '+fmtMoney(Math.round(est/10)*10)+' 上下(只依直線距離和時間估,不是正式跳表價)。\n\n'+fmtMoney(revenue)+' 跟參考範圍差很多,確定金額沒打錯嗎?(長途、包車、有加成就按「確定」)';
    }
    if(est>0) return '';
  }
  var recent = state.records.filter(function(r){ return !platformDef(r.platform).tipOnly && r.platform!=='bonus' && (+r.revenue||0)>0; })
    .slice(-100).map(function(r){ return +r.revenue; }).sort(function(a,b){ return a-b; });
  if(recent.length<10) return revenue>=3000 ? fmtMoney(revenue)+' 是一筆很大的金額,確定沒有多打一個 0 嗎?' : '';
  var median = recent[Math.floor(recent.length/2)];
  if(revenue >= Math.max(1500, median*6)) return fmtMoney(revenue)+' 比你平常一趟高很多(你最近每趟車資的中間值約 '+fmtMoney(median)+')。\n\n確定金額沒打錯嗎?(長途或有加成就按「確定」)';
  return '';
}
function saveIncome(key, editId){
  var def = platformDef(key);
  function grab(id){ var el=document.getElementById(id); return el? el.value : null; }
  var existing = editId ? state.records.filter(function(r){return r.id===editId;})[0] : null;
  var revenue = +grab('f-revenue') || 0;
  var tipF = tipFromForm();
  if(tipF && tipF.fx && tipF.fx.amt>0 && !tipF.fx.rate){ alert('外幣小費請填匯率。'); return; }
  var tip = tipF ? tipF.tip : ((existing && +existing.tip) || 0);
  var note = grab('f-note')!=null ? grab('f-note').trim() : ((existing && existing.note) || '');
  if(revenue<=0 && tip<=0){ closeModal(); return; }
  if(!existing){
    // a double tap on 儲存 or the same fare entered twice shows up as an identical record moments apart
    var dupAgo = Date.now() - DUP_WINDOW_MS;
    var dup = state.records.filter(function(r){ return r.platform===key && (+r.revenue||0)===revenue && (+r.tip||0)===tip && (r.ts||0)>=dupAgo; })[0];
    if(dup && !confirm('這筆跟 '+hhmm(dup.ts)+' 剛記的那筆一模一樣('+platformDef(key).label+' '+fmtMoney(revenue||tip)+')。\n\n確定要再記一次嗎?')) return;
  }
  if(!def.tipOnly && !def.bonus && !(existing && (+existing.revenue||0)===revenue)){
    var linkEl = document.getElementById('f-trip-link'), linkV = linkEl ? linkEl.value : '';
    var tripForCheck = existing && existing.pickup ? existing : (linkV && linkV!=='none' ? findPendingTrip(linkV) : null);
    var tooHigh = fareLooksTooHigh(revenue, tripForCheck, key);
    if(tooHigh && !confirm(tooHigh)) return;
  }
  var rec = existing || {id:uid(), date:currentEntryDate(), ts:Date.now(), platform:key, fees:resolvedFeeRules()};
  rec.revenue = revenue; rec.tip = tip; rec.note = note;
  if(tipF) rec.tipFx = (tipF.fx && tipF.fx.amt>0) ? tipF.fx : undefined;
  if(def.subtypeOptions && grab('chip-subtype')!=null) rec.subtype = grab('chip-subtype');
  else if(key==='uber' && isYellowCab() && !(existing&&existing.subtype)) rec.subtype = '優步小黃';
  if(def.fareTypeOptions) rec.fareType = grab('chip-fareType');
  if(def.discountOptions){ rec.discountTier = grab('chip-discountTier'); rec.discountFinal = true; }
  markFeeRules(rec, key, existing);

/* ---------- 🎯 campaigns: short fleet promotions the driver types in when they see one ---------- */
// ways of getting a passenger that never come with fleet promotions
var NOT_A_FLEET = ['private','hailyellow','street','reservation','phonecall'];
var CAMP_TYPES = [['per','每趟加給'],['tier','跑滿 N 趟拿獎金'],['after','達標後每趟加錢'],['pct','達標後回饋車資 %']];
function campPlatforms(){
  return visiblePlatforms().filter(function(p){ var d = platformDef(p.key); return !d.tipOnly && !d.bonus && NOT_A_FLEET.indexOf(p.key)<0; });
}
// trips count by when the job was accepted
function campTripTime(r){ return (r.accept&&r.accept.ts) || (r.pickup&&r.pickup.ts) || r.ts; }
function campTrips(c){
  return state.records.filter(function(r){ if(r.platform!==c.platform) return false; var t = campTripTime(r); return t>=c.from && t<=c.to; });
}
// trips: the campaign's trips (campTrips); the % kind needs them in order and their fares
function campReward(c, trips){
  var n = trips.length;
  if(c.type==='pct'){
    // e.g. BOLT「完成 100 趟後每趟額外 5%」: trips after the Nth, or with pctAll every trip once the target is met
    if(n < c.afterN) return 0;
    var sorted = trips.slice().sort(function(a,b){ return campTripTime(a)-campTripTime(b); });
    var paid = c.pctAll ? sorted : sorted.slice(c.afterN);
    return Math.round(paid.reduce(function(a,r){ return a + grossBase(r)*(+c.afterPct||0)/100; }, 0));
  }
  if(c.type==='tier'){ var best = 0; (c.tiers||[]).forEach(function(t){ if(n>=t.n) best = Math.max(best, t.amt); }); return best; }
  if(c.type==='after') return n>=c.afterN ? (+c.afterBase||0) + (n-c.afterN)*(+c.afterAmt||0) : 0;
  return 0;
}
function campTimeLabel(c){
  var a = new Date(c.from), b = new Date(c.to);
  var sameDay = toDateStr(a)===toDateStr(b);
  var d = function(x){ return (x.getMonth()+1)+'/'+x.getDate(); };
  return (toDateStr(a)===toDateStr(new Date()) ? '' : d(a)+' ')+hhmm(c.from)+'–'+(sameDay?'':d(b)+' ')+hhmm(c.to);
}
function campRuleLabel(c){
  if(c.type==='per') return '每趟 +'+fmtMoney(c.perAmt);
  if(c.type==='tier') return (c.tiers||[]).map(function(t){ return t.n+' 趟 '+fmtMoney(t.amt); }).join('、');
  if(c.type==='pct') return '跑滿 '+c.afterN+' 趟,'+(c.pctAll ? '全部趟次' : '之後每趟')+'回饋車資 '+c.afterPct+'%';
  return '跑滿 '+c.afterN+' 趟'+(+c.afterBase?(' 先拿 '+fmtMoney(c.afterBase)+','):',')+'之後每趟 +'+fmtMoney(c.afterAmt);
}
// the per-trip campaign that applies to a trip of this platform taken now (or the record being edited)
function perCampaignFor(key, existing){
  var times = existing ? [campTripTime(existing)] : [Date.now()];
  if(!existing){
    if(state.pendingAccept) times.push(state.pendingAccept.ts);
    if(state.activeTrip) times.push(campTripTime(state.activeTrip));
    (state.pendingTrips||[]).forEach(function(t){ times.push(campTripTime(t)); });
  }
  return (state.campaigns||[]).filter(function(c){
    return c.type==='per' && c.platform===key && times.some(function(t){ return t>=c.from && t<=c.to; });
  })[0] || null;
}
function campaignCheckHtml(key, existing){

  if(!amt) return '';
  var on = existing ? !!existing.tripBonus : true;

    '<input type="checkbox" id="f-camp" data-amt="'+amt+'" data-id="'+(c?c.id:(existing&&existing.campaignId)||'')+'" style="width:18px;height:18px;flex:none"'+(on?' checked':'')+'>'+
    '🎯 活動加給 +'+fmtMoney(amt)+(c?'<span style="font-weight:400;color:var(--text-muted);font-size:11.5px">('+campTimeLabel(c)+')</span>':'')+'</label>';

// 🔁 weekly repeating cards. The card the driver set up is the pattern: on each chosen weekday (or, for a
// card longer than a day such as a whole-week goal, every 7 days) a copy for that day appears by itself,
// with its own trip count and its own 記入獎勵. Editing the pattern changes the copies made after that.
var WEEKDAY_NAMES = ['一','二','三','四','五','六','日'];
function isoWeekday(ts){ return (new Date(ts).getDay()+6)%7+1; }
function campRepeatLabel(c){
  if(!c.repeat) return '';
  return c.repeat.every7 ? '每週' : '每週'+(c.repeat.days||[]).map(function(d){ return WEEKDAY_NAMES[d-1]; }).join('、');
}
function ensureRepeatCampaigns(){
  var list = state.campaigns||[], now = Date.now(), added = 0;
  list.filter(function(c){ return c.repeat && !c.repeatOf; }).forEach(function(c){
    var len = c.to - c.from, starts = [];
    if(c.repeat.every7){
      // the week running now, or starting within the next 12 hours
      var k = Math.floor((now + 12*3600000 - c.from) / (7*86400000));
      if(k>=1) starts.push(c.from + k*7*86400000);
    } else {
      // today's window at the same time of day (a window starting before the day cutoff belongs to tonight)
      var f = new Date(c.from), t0 = new Date(todayStr()+'T'+pad(f.getHours())+':'+pad(f.getMinutes())+':00').getTime();
      if(f.getHours() < dayCutoffHour()) t0 += 86400000;
      if(t0 > c.from && (c.repeat.days||[]).indexOf(isoWeekday(t0))>=0) starts.push(t0);
    }
    starts.forEach(function(st){
      if(list.some(function(x){ return (x.id===c.id || x.repeatOf===c.id) && Math.abs(x.from-st) < 3600000; })) return;
      var copy = JSON.parse(JSON.stringify(c));
      copy.id = uid(); copy.from = st; copy.to = st + len; copy.repeatOf = c.id;
      delete copy.repeat; delete copy.settled;
      list.push(copy); added++;
    });
  });
  if(added){ state.campaigns = list; save(); }
}
function visibleCampaigns(){
  var dayStart = new Date(todayStr()+'T00:00:00').getTime() + dayCutoffHour()*3600000, now = Date.now();
  return (state.campaigns||[]).filter(function(c){
    if(c.to >= dayStart || c.from > now) return true;
    // finished goals still waiting for "did you get it?"
    return c.type!=='per' && !c.settled && now - c.to < 14*86400000;
  }).sort(function(a,b){ return a.from-b.from; });
}
function campaignSectionHtml(){
  if(!uiShow('campaign')) return '';
  ensureRepeatCampaigns();
  var list = visibleCampaigns(), now = Date.now();
  var h = '<div class="section"><div class="section-title">🎯 活動</div><div class="card" style="padding:10px 12px">';
  if(!list.length) h += '<div style="font-size:12.5px;color:var(--text-muted);padding:4px 0 8px">車隊有活動時,在這裡建一張活動卡,記帳本會幫你算趟數和獎勵。</div>';
  list.forEach(function(c){
    var trips = campTrips(c), n = trips.length, live = now>=c.from && now<=c.to, ended = now>c.to;
    var p = platformDef(c.platform);
    var status = c.from>now ? '尚未開始' : (live ? '進行中 · 剩 '+Math.max(1, Math.round((c.to-now)/60000))+' 分' : '已結束');

function saveCampaign(id){

  var repEl = document.getElementById('f-camp-rep');

/* ---------- foreign-currency tips: reference rate from ExchangeRate-API (daily mid-market), editable ---------- */
var FX_CURS = [['TWD','新台幣','🇹🇼'],['USD','美金','🇺🇸'],['JPY','日圓','🇯🇵'],['KRW','韓元','🇰🇷'],['HKD','港幣','🇭🇰'],['CNY','人民幣','🇨🇳'],['EUR','歐元','🇪🇺'],['SGD','新加坡幣','🇸🇬'],['GBP','英鎊','🇬🇧'],['AUD','澳幣','🇦🇺'],['THB','泰銖','🇹🇭'],['MYR','馬幣','🇲🇾']];
var fxLoading = false;
// NT$ for one unit of the currency, from the last fetched table
function fxRate(cur){
  var c = state.fxCache; if(!c || !c.rates || !c.rates.TWD || !c.rates[cur]) return null;
  return Math.round(c.rates.TWD / c.rates[cur] * 10000) / 10000;
}
function fxRefresh(after){
  var today = toDateStr(new Date());
  if((state.fxCache && state.fxCache.date===today) || fxLoading || typeof fetch!=='function') return;
  fxLoading = true;
  fetch('https://open.er-api.com/v6/latest/USD', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
    if(j && j.result==='success' && j.rates){ state.fxCache = {date:today, rates:j.rates}; save(); if(after) after(); }
  }, function(){}).then(function(){ fxLoading = false; });
}

function tipFxUpdate(){
  var c = document.getElementById('f-tip-cur'); if(!c) return;

// the tip in NT$, plus what was actually handed over when it was foreign money
function tipFromForm(){

  var amt = +el.value||0, c = document.getElementById('f-tip-cur');

// a clock time on the business day: hours before the day boundary belong to the next calendar date
function tsOnBusinessDay(t, hm){
  var d = new Date(t+'T'+hm+':00');
  if(d.getHours() < dayCutoffHour()) d.setDate(d.getDate()+1);
  return d.getTime();
}
function saveShiftFix(){
  var t = todayStr(), m = dm(t);
  var sv = document.getElementById('f-sf-start').value;
  if(!sv){ alert('請選擇幾點開始上班。'); return; }
  var start = tsOnBusinessDay(t, sv), brk = Math.max(0, +document.getElementById('f-sf-break').value||0)*60000;
  if(start > Date.now()){ alert('上班時間不能比現在晚。'); return; }
  if(document.getElementById('chip-sfState').value==='已經下班'){
    if(m.activeShiftStart){ alert('你現在還在上班中。要補登已經跑完的這段,請先按「下班打卡」;或選「還在跑」把上班時間往前調。'); return; }
    var ev = document.getElementById('f-sf-end').value;
    if(!ev){ alert('請選擇幾點下班。'); return; }
    var end = tsOnBusinessDay(t, ev);
    if(end <= start){ alert('下班時間要比上班時間晚。'); return; }
    if(end - start <= brk){ alert('休息時間比上班時間還長,請再確認。'); return; }
    m.workedMs += end - start - brk; m.breakMs += brk;
  } else {
    if(m.activeShiftStart){
      if(start < m.activeShiftStart){ m.workedMs += m.activeShiftStart - start; m.activeShiftStart = start; }
    } else {
      var staleD = findStaleOpenShiftDate();
      if(staleD){ openStaleShiftModal(staleD); return; }
      m.activeShiftStart = start; m.segmentStart = start; m.onBreak = false;
    }
    m.workedMs -= brk; m.breakMs += brk;
  }
  save(function(ok){ if(ok) showToast('已補登上班時間'); }); closeModal(); renderAll();
}

  if(addOn.length) h += tile('加價單', addOn.length+' 單') + tile('加價多收', fmtMoney(addOn.reduce(function(a,r){ return a+r.addOn; },0)), 'income');
  h += '</div>';
  var note = '';

function wirePlatformDrag(){
  var list = document.getElementById('platOrderList');
  if(!list) return;
  function rows(){ return Array.prototype.slice.call(list.children); }
  Array.prototype.slice.call(list.querySelectorAll('.plat-drag-handle')).forEach(function(handle){
    handle.addEventListener('pointerdown', function(e){
      e.preventDefault();
      var dragEl = handle.closest('.plat-row');
      dragEl.classList.add('dragging');
      try{ dragEl.setPointerCapture(e.pointerId); }catch(err){}
      function onMove(ev){
        var others = rows().filter(function(r){ return r!==dragEl; });
        var placed = false;
        for(var i=0;i<others.length;i++){
          var rect = others[i].getBoundingClientRect();
          var mid = rect.top+rect.height/2;
          if(ev.clientY < mid){ list.insertBefore(dragEl, others[i]); placed=true; break; }
        }
        if(!placed) list.appendChild(dragEl);
      }
      function onUp(ev){
        dragEl.classList.remove('dragging');
        try{ dragEl.releasePointerCapture(ev.pointerId); }catch(err){}
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        state.platformOrder = rows().map(function(r){ return r.getAttribute('data-key'); });
        save();
      }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  });
}

  if(navigator.clipboard && navigator.clipboard.writeText){

function ledgerSummary(st){

  var dates = (st.records||[]).map(function(r){ return r.date; }).concat((st.expenses||[]).map(function(e){ return e.date; })).filter(Boolean).sort();
  // the newest income entry, so a check can catch a changed amount and not only a changed count
  var last = null;
  recs.forEach(function(r){
    var k = (r.date||'')+' '+(r.time||'')+' '+String(r.ts||r.createdAt||0).padStart(15, '0');
    if(!last || k>last.k) last = {k:k, date:r.date||'', amt:+r.revenue||0};
  });
  return {recs:recs.length, exps:(st.expenses||[]).length, from:dates[0]||'', to:dates[dates.length-1]||'', last:last};

function keepUndoCopy(label, done){

  function fin(ok){
    if(ok){ state.undoMeta = {at:at, label:label}; try{ localStorage.setItem('taxi_undo_info', JSON.stringify({at:at, label:label})); }catch(e){} }
    if(done) done(ok);
  }
  try{ copy = JSON.stringify({at:at, label:label, data:packState(state)}); }catch(e){ fin(false); return; }
  if(NATIVE_FS){
    NATIVE_FS.writeFile({path:'ledger-undo.json', directory:'DATA', encoding:'utf8', data:copy}).then(function(){ fin(true); }, function(){ fin(false); });
    return;
  }
  if(__BOOT.idb){
    try{
      var tx = __BOOT.idb.transaction('kv','readwrite');

var LEDGER_PART_NAMES = {expenses:'支出', dailyMeta:'每日工時與里程', fixedCosts:'固定成本', fixedOverrides:'固定成本覆寫', targets:'目標', feeRules:'手續費設定', platformOverrides:'平台設定', customPlatforms:'自訂平台', platformOrder:'平台排列', payoutSettings:'撥款設定', payouts:'撥款核對', pendingTrips:'行程'};

function ledgerProblem(p){
  if(!p || typeof p!=='object' || Array.isArray(p)) return '這不是記帳本的備份資料';
  if(+p.fmt > LEDGER_FMT) return '這份備份是比較新版的記帳本做的,請先更新記帳本(完全關掉再打開)再還原';
  if(!Array.isArray(p.records)) return '找不到收入資料';
  var d = defaultState();
  for(var k in d){
    if(!(k in p) || d[k]===null || typeof d[k]!=='object') continue;
    if(p[k]===null || typeof p[k]!=='object' || Array.isArray(p[k])!==Array.isArray(d[k])) return '「'+((typeof LEDGER_PART_NAMES!=='undefined' && LEDGER_PART_NAMES[k])||k)+'」這部分的格式不對';

  function finiteOrEmpty(v){ return v==null || v==='' || isFinite(+v); }

    for(var i=0;i<list.length;i++){
      var x = list[i];
      if(!isObj(x) || !/^\d{4}-\d{2}-\d{2}$/.test(String(x.date||''))) return what+'第 '+(i+1)+' 筆的日期格式不對';
      if(typeof x[typeKey]!=='string') return what+'第 '+(i+1)+' 筆少了類別';
      if(!finiteOrEmpty(x[amountKey]) || !finiteOrEmpty(x.tip) || !finiteOrEmpty(x.ts)) return what+'第 '+(i+1)+' 筆的金額格式不對';

    objValues(p.dailyMeta||{}, '每日工時與里程') || objValues(p.payoutSettings||{}, '撥款設定') ||
    numValues(p.feeRules||{}, '手續費設定') || numValues(p.targets||{}, '目標') ||
    ((p.activeTrip!=null && !isObj(p.activeTrip)) ? '「載客中的行程」格式不對' : '');

function replaceLedger(parsed, undoLabel, okMsg){

/* ---------- EVENT DELEGATION ---------- */
/* ---------- screen readers and keyboards ----------
   Screens are built from HTML strings, so after each change one pass fills in what the markup leaves out:
   each form label is tied to its field, tappable boxes are announced and reachable as buttons,
   and icon-only close buttons get a name. */
var a11yQueued = false, a11yUid = 0;
// TalkBack reads "$" as US dollars and reads every emoji by its long name ("鉛筆類別的表情符號"),
// so amounts get a spoken "元" twin and decorative emoji and the "—" placeholders are skipped
var A11Y_EMOJI = '(?:[\\u2600-\\u27BF\\u2B00-\\u2BFF]|\\uD83C[\\uDC00-\\uDFFF]|\\uD83D[\\uDC00-\\uDFFF]|\\uD83E[\\uDC00-\\uDFFF])[\\uFE0F\\u200D]*';
var A11Y_MONEY = '([+\\-\\u2212]?)\\$\\s?([\\d,]+(?:\\.\\d+)?)';
function a11ySpeak(s){
  return String(s).replace(new RegExp(A11Y_MONEY, 'g'), function(m, sign, num){ return (sign && sign!=='+' ? '負 ' : '')+num+' 元'; })
    .replace(new RegExp(A11Y_EMOJI, 'g'), '').replace(/\s+/g, ' ').trim();
}
function a11yText(){
  var hit = new RegExp(A11Y_EMOJI+'|\\$\\s?[\\d,]|^\\s*[\\u2014\\u2013]\\s*$'), todo = [], n;
  var w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
  while((n = w.nextNode())){
    var p = n.parentNode;
    if(!p || !hit.test(n.nodeValue) || p.closest('[aria-hidden="true"],script,style,textarea,option,svg,.sr-only')) continue;
    todo.push(n);
  }
  todo.forEach(function(t){
    var p = t.parentNode, v = t.nodeValue, ctl = p.closest('button,a,[role=button],[role=tab],label');
    // an icon-only control with no name keeps its emoji, or it would be announced as a nameless button
    if(ctl && !ctl.hasAttribute('aria-label') && !a11ySpeak(ctl.textContent)) return;
    if(p!==ctl && p.childNodes.length===1 && !a11ySpeak(v)){ p.setAttribute('aria-hidden', 'true'); return; }
    if(/^\s*[—–]\s*$/.test(v)){ var dash = document.createElement('span'); dash.setAttribute('aria-hidden', 'true'); p.replaceChild(dash, t); dash.appendChild(t); return; }
    var re = new RegExp(A11Y_EMOJI+'|'+A11Y_MONEY, 'g'), frag = document.createDocumentFragment(), last = 0, m;
    while((m = re.exec(v))){
      if(m.index>last) frag.appendChild(document.createTextNode(v.slice(last, m.index)));
      var shown = document.createElement('span'); shown.setAttribute('aria-hidden', 'true'); shown.textContent = m[0]; frag.appendChild(shown);
      if(m[0].indexOf('$')>=0){ var said = document.createElement('span'); said.className = 'sr-only'; said.textContent = a11ySpeak(m[0]); frag.appendChild(said); }
      last = re.lastIndex;
    }
    if(last<v.length) frag.appendChild(document.createTextNode(v.slice(last)));
    p.replaceChild(frag, t);
  });
  var named = document.querySelectorAll('[aria-label]');
  for(var i=0;i<named.length;i++){
    var lb = named[i].getAttribute('aria-label'), sp = a11ySpeak(lb);

}

function a11yVisible(el){ var c = el.cloneNode(true), s = c.querySelectorAll('.sr-only'); for(var i=0;i<s.length;i++) s[i].parentNode.removeChild(s[i]); return c.textContent; }
function a11yPass(){
  a11yQueued = false;
  var rows = document.querySelectorAll('.form-row');
  for(var i=0;i<rows.length;i++){
    var lab = rows[i].querySelector('label');
    if(!lab || lab.htmlFor || lab.querySelector('input,select,textarea')) continue;
    var ctl = rows[i].querySelector('input:not([type=hidden]),select,textarea');
    if(!ctl) continue;
    if(!ctl.id) ctl.id = 'a11y-f'+(++a11yUid);
    lab.htmlFor = ctl.id;
  }
  var acts = document.querySelectorAll('[data-act]:not(button):not(input):not(select):not(textarea):not(label):not([role])');

    var el = acts[j], act = el.getAttribute('data-act');

  }

  var stepNames = {'month:-1':'上個月', 'month:1':'下個月', 'year:-1':'上一年', 'year:1':'下一年', 'day:-1':'前一天', 'day:1':'後一天'};
  var steps = document.querySelectorAll('[data-act^="month:"]:not([aria-label]),[data-act^="year:"]:not([aria-label]),[data-act^="day:"]:not([aria-label])');

document.addEventListener('keydown', function(e){

  if(!sheet) return;
  if(e.key==='Escape'){ e.preventDefault(); closeModal(); return; }
  if(e.key==='Tab'){
    // keep Tab inside the open sheet
    var f = Array.prototype.filter.call(sheet.querySelectorAll('button,input,select,textarea,a[href],[tabindex]:not([tabindex="-1"])'), function(x){ return !x.disabled && x.offsetParent!==null; });

/* ---------- the installed app's own copy of the ledger ----------
   Inside the app the phone may clear the web view's storage on its own (iOS can), so the ledger is also
   kept as a file in the app's private data folder, and that file is what the app trusts. Two files take
   turns, each carrying its revision: a write cut short can only spoil the one being written, while the
   other still holds the previous save. The website does not use any of this. */
var NATIVE_FS = (function(){
  try{ return (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && window.Capacitor.Plugins.Filesystem) || null; }catch(e){ return null; }
})();
var NATIVE_SLOTS = ['ledger-a.json', 'ledger-b.json'];
function nativeMetaName(f){ return f.replace(/\.json$/, '.meta'); }
function bytesToBase64(u8){
  var out = '', CH = 0x8000;
  for(var i=0; i<u8.length; i+=CH) out += String.fromCharCode.apply(null, u8.subarray(i, i+CH));
  return btoa(out);
}
function base64ToBytes(b64){
  var bin = atob(b64), u8 = new Uint8Array(bin.length);
  for(var i=0; i<bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}
// null when this web view cannot compress
function gzipBase64(text){
  try{
    if(typeof CompressionStream==='undefined') return Promise.resolve(null);
    var cs = new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
    return new Response(cs).arrayBuffer().then(function(buf){ return bytesToBase64(new Uint8Array(buf)); }, function(){ return null; });
  }catch(e){ return Promise.resolve(null); }
}
// gzip (checked by its own CRC) or plain UTF-8 text; rejects when a gzip file is cut off or damaged
function bytesToText(u8){
  if(u8.length>2 && u8[0]===0x1f && u8[1]===0x8b){
    if(typeof DecompressionStream==='undefined') return Promise.reject(new Error('no gunzip'));
    return new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }
  return Promise.resolve(new TextDecoder('utf-8').decode(u8));
}
function nativeSlotOk(o){
  if(!o || typeof o.data!=='string' || !isFinite(o.rev) || Math.floor(+o.rev)!==+o.rev || +o.rev<0) return false;
  if(o.len!=null && o.len!==o.data.length) return false;
  return true;
}
// one slot -> {rev, data, slot, metaRev, envelope} or null. Older files are a JSON envelope {rev,len,data}, each
// written whole by the older app and counted as finished. This app writes the same envelope when the web view
// cannot compress, marked commit:'meta': that one is finished only when its index agrees, like a compressed one. Newer ones are the compressed ledger itself (gzip's own
// check catches a cut-off file) with an index file as the commit mark, written only after the ledger: a save is
// finished only when a readable index names the revision inside the ledger. load() makes that comparison.
function nativeReadSlot(f, meta){
  return NATIVE_FS.readFile({path:f, directory:'DATA'}).then(function(r){
    return bytesToText(base64ToBytes(r.data));
  }).then(function(text){
    if(text.slice(0,7)==='{"rev":'){
      var o = JSON.parse(text);
      if(!nativeSlotOk(o)) return null;
      if(o.commit==='meta') return {rev:+o.rev, data:o.data, slot:f, metaRev:(meta ? +meta.rev : undefined)};
      return {rev:+o.rev, data:o.data, slot:f, envelope:true};
    }
    if(meta) return {rev:+meta.rev, data:text, slot:f, metaRev:+meta.rev};
    var inner = JSON.parse(text);
    return (inner && isFinite(inner.rev)) ? {rev:+inner.rev, data:text, slot:f} : null;
  }).catch(function(){ return null; });
}
// -> {state:'none'} when the folder listing shows no ledger files (a new install, or a phone still on its
//    web view copy); {state:'ok', candidates} newest first, the first one already read and the rest read
//    only if load() turns it down; {state:'bad'} when files exist but none can be read.
//    A failed listing rejects: we cannot tell.
function nativeReadLedger(){
  return NATIVE_FS.readdir({path:'', directory:'DATA'}).then(function(r){
    var names = (r.files||[]).map(function(f){ return typeof f==='string' ? f : f.name; });
    var present = NATIVE_SLOTS.filter(function(f){ return names.indexOf(f)>=0; });
    if(!present.length) return {state:'none'};
    return Promise.all(present.map(function(f){
      if(names.indexOf(nativeMetaName(f))<0) return null;
      // an index counts only with a whole-number revision; anything else is treated as no index
      return NATIVE_FS.readFile({path:nativeMetaName(f), directory:'DATA', encoding:'utf8'}).then(function(m){
        var o = JSON.parse(m.data);
        return (o && typeof o.rev==='number' && isFinite(o.rev) && Math.floor(o.rev)===o.rev && o.rev>=0 && (o.len==null || typeof o.len==='number')) ? o : null;
      }).catch(function(){ return null; });
    })).then(function(metas){
      var slots = present.map(function(f, i){ return {slot:f, meta:metas[i]}; });
      // a slot without a readable index (files from before, or an index write that was cut off) is read in full
      // to learn its revision; otherwise the index order is enough
      var unknown = slots.filter(function(x){ return !x.meta; });
      return Promise.all(unknown.map(function(x){ return nativeReadSlot(x.slot, null).then(function(c){ x.cand = c; x.rev = c ? c.rev : -1; }); })).then(function(){
        slots.forEach(function(x){ if(x.meta) x.rev = +x.meta.rev; });
        slots.sort(function(a,b){ return b.rev-a.rev; });
        var list = [];
        function next(i){
          if(i>=slots.length) return list.length ? {state:'ok', candidates:list} : {state:'bad'};
          var x = slots[i];
          if(!x.meta){ if(x.cand) list.push(x.cand); return next(i+1); }
          if(list.length){ list.push({slot:x.slot, rev:x.rev, meta:x.meta, metaRev:+x.meta.rev, data:null}); return next(i+1); }
          return nativeReadSlot(x.slot, x.meta).then(function(c){ if(c) list.push(c); return next(i+1); });
        }
        return next(0);
      });
    });
  });
}

// Load saved data from IndexedDB (large storage) first, then start the app with it.
// If IndexedDB is unavailable the app falls back to localStorage like before.
var __BOOT = {state:null, idb:null, idbError:false};
(function(){
  var started = false;
  function start(){
    if(started) return; started = true;
    try{ __taxiMain(); }
    catch(e){
      if(e && e.nativeBad){ nativeBootProblem(e.kind); return; }
      if(e && e.nativeNeed){
        // the newest ledger did not pass the full check: read the older one and start over
        // (nothing before load() in the app has any lasting effect)
        var c = e.nativeNeed;
        nativeReadSlot(c.slot, c.meta).then(function(got){
          var list = __BOOT.nativeCandidates;
          if(got){ c.data = got.data; c.rev = got.rev; c.metaRev = got.metaRev; c.envelope = got.envelope; } else list.splice(list.indexOf(c), 1);
          started = false; start();
        });
        return;
      }
      throw e;
    }
  }
  // In the app the ledger file decides. Only when there is no file at all does the web view copy count
  // (moving an existing ledger in); a slow or unreadable file never starts the app with an empty ledger.
  function go(){
    if(started) return;
    if(!NATIVE_FS){ start(); return; }
    var slow = setTimeout(function(){ nativeBootProblem('slow'); }, 4000);
    nativeReadLedger().then(function(r){
      clearTimeout(slow);
      if(r.state==='ok'){ __BOOT.nativeCandidates = r.candidates; __BOOT.state = null; start(); }
      else if(r.state==='none'){ __BOOT.moveInFromCache = __BOOT.state!=null; start(); }
      else nativeBootProblem('bad');
    }, function(){ clearTimeout(slow); nativeBootProblem('unknown'); });
  }
  if(!window.indexedDB){ go(); return; }
  try{
    var req = indexedDB.open('taxi_ledger', 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore('kv'); };
    req.onsuccess = function(){
      var db = req.result;
      try{
        var g = db.transaction('kv','readonly').objectStore('kv').get('state');
        g.onsuccess = function(){
          __BOOT.idb = db; __BOOT.state = (typeof g.result==='string') ? g.result : null;
          try{ var gr = db.transaction('kv','readonly').objectStore('kv').get('state_rev'); gr.onsuccess = function(){ __BOOT.rev = +gr.result||0; go(); }; gr.onerror = function(){ go(); }; }catch(e){ go(); }
        };
        g.onerror = function(){ __BOOT.idbError = true; go(); };
      }catch(e){ __BOOT.idbError = true; go(); }
    };
    req.onerror = function(){ __BOOT.idbError = true; go(); };
    req.onblocked = function(){ __BOOT.idbError = true; go(); };
  }catch(e){ __BOOT.idbError = true; go(); }
})();
