<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F3F0E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15130F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>跑車人生</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#F3F0E8;
  --surface:#FFFFFF;
  --surface-sunken:#E7E1D2;
  --text:#231F18;
  --text-muted:#7A735F;
  --border:#DED6C2;
  --accent:#C97E17;
  --accent-strong:#9C6110;
  --accent-soft:#F2DFB6;
  --income:#1E7A4C;
  --income-soft:#DCEFE2;
  --expense:#B8402C;
  --expense-soft:#F8E1DA;
  --shadow: 0 1px 2px rgba(35,31,24,.06), 0 4px 14px rgba(35,31,24,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15130F;
    --surface:#1E1B15;
    --surface-sunken:#0F0D0A;
    --text:#F1ECDF;
    --text-muted:#A79C82;
    --border:#332C20;
    --accent:#E5A33D;
    --accent-strong:#F0B655;
    --accent-soft:#3A2C14;
    --income:#4FC98A;
    --income-soft:#193024;
    --expense:#E5715A;
    --expense-soft:#3A1D16;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#15130F;
  --surface:#1E1B15;
  --surface-sunken:#0F0D0A;
  --text:#F1ECDF;
  --text-muted:#A79C82;
  --border:#332C20;
  --accent:#E5A33D;
  --accent-strong:#F0B655;
  --accent-soft:#3A2C14;
  --income:#4FC98A;
  --income-soft:#193024;
  --expense:#E5715A;
  --expense-soft:#3A1D16;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Noto Sans TC', system-ui, sans-serif;
  font-variant-numeric:tabular-nums;
  padding-top:env(safe-area-inset-top,0px);
}
.num{font-family:'Space Grotesk','Noto Sans TC',system-ui,sans-serif;}
.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;position:relative}
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--bg);
  padding:14px 16px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:baseline;gap:8px}
.brand-name{font-weight:900;font-size:19px;letter-spacing:.2px}
.topbar-right{display:flex;align-items:center;gap:10px;min-width:0}
.big-ui .topbar{padding-left:10px;padding-right:10px;gap:6px}
.big-ui .topbar-right{gap:6px}
.big-ui .brand{min-width:0;overflow:hidden}
.big-ui .brand-name{min-width:0;overflow:hidden;text-overflow:ellipsis}
.big-ui .icon-btn{width:30px;height:30px;font-size:14px;flex:none}
.big-ui .today-net{font-size:13px}
.big-ui .summary-row{grid-template-columns:1fr 1fr !important}
.today-net{font-family:'Space Grotesk';font-weight:700;font-size:15px;text-align:right;line-height:1.25}
.brand-name{white-space:nowrap}
.today-net.pos{color:var(--income)}
.today-net.neg{color:var(--expense)}
.icon-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface);display:flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer;color:var(--text);
}
.backup-btn{position:relative}
.backup-btn .bk-days{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:var(--text-muted);color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center;font-style:normal}
.backup-btn .bk-days.due{background:var(--expense)}
.content{flex:1;overflow-y:auto;padding:14px 16px 24px;-webkit-overflow-scrolling:touch}
.bottom-nav{
  position:sticky;bottom:0;z-index:20;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--surface);border-top:1px solid var(--border);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
}
.nav-btn{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;color:var(--text-muted);font-size:11px;
  padding:6px 2px;border-radius:10px;cursor:pointer;font-family:inherit;
}
.nav-btn .ic{font-size:19px;position:relative}
.nav-badge{position:absolute;top:-5px;right:-11px;min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:var(--expense);color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center;font-style:normal}
.nav-btn.active{color:var(--accent-strong)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.section{margin-bottom:16px}
.section-title{font-size:13px;font-weight:700;color:var(--text-muted);margin:0 0 8px 2px;display:flex;align-items:center;justify-content:space-between}

.summary-row{display:grid;gap:8px}
.stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 12px}
.stat-tile .lbl{font-size:10.5px;color:var(--text-muted);margin-bottom:4px}
.stat-tile .val{font-family:'Space Grotesk';font-weight:700;font-size:16px}
.stat-tile .val.income{color:var(--income)}
.stat-tile .val.expense{color:var(--expense)}

.platform-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.big-ui .platform-grid,.big-ui .expense-grid{grid-template-columns:repeat(2,1fr)}
.platform-chip{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:12px 6px;text-align:center;cursor:pointer;min-height:62px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
}
.platform-chip:active{background:var(--accent-soft)}
.plat-badge{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:1px;flex:none}
.platform-chip .pname{font-size:12px;font-weight:700;line-height:1.25}
.platform-chip .ptotal{font-size:10.5px;color:var(--text-muted);font-family:'Space Grotesk'}
.platform-chip .ptotal.has{color:var(--income)}

.expense-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.expense-chip{
  background:var(--expense-soft);border:1px solid var(--border);border-radius:14px;
  padding:10px 8px;text-align:center;cursor:pointer;min-height:56px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
}
.expense-chip .eic{font-size:17px}
.expense-chip .ename{font-size:12px;font-weight:700;color:var(--expense)}

.daily-card{display:flex;flex-direction:column;gap:10px}
.daily-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.daily-row .l{font-size:13px;font-weight:700;color:var(--text-muted)}
.km-input{
  width:100px;text-align:right;font-family:'Space Grotesk';font-weight:700;font-size:15px;
  background:var(--surface-sunken);border:1px solid var(--border);border-radius:10px;padding:7px 9px;color:var(--text)
}
.shift-btn{
  border:none;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;
}
.shift-btn.start{background:var(--income-soft);color:var(--income)}
.shift-btn.stop{background:var(--expense-soft);color:var(--expense)}
.hours-badge{font-family:'Space Grotesk';font-weight:700;font-size:13px}

.list-item{
  display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);
}
.list-item:last-child{border-bottom:none}
.li-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.li-body{flex:1;min-width:0}
.li-title{font-size:13.5px;font-weight:700}
.li-sub{font-size:11px;color:var(--text-muted)}
.li-amt{font-family:'Space Grotesk';font-weight:700;font-size:14.5px;white-space:nowrap}
.li-amt.income{color:var(--income)}
.li-amt.expense{color:var(--expense)}
.li-del{background:none;border:none;color:var(--text-muted);font-size:16px;cursor:pointer;padding:4px 2px}

.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.month-nav .m-title{font-weight:700;font-size:15px}
.month-nav button{background:var(--surface);border:1px solid var(--border);width:32px;height:32px;border-radius:9px;font-size:15px;cursor:pointer;color:var(--text)}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:6px}
.cal-dow{text-align:center;font-size:10.5px;color:var(--text-muted);font-weight:700;padding-bottom:2px}
.cal-cell{
  aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--surface-sunken);cursor:pointer;font-size:10.5px;gap:1px;border:2px solid transparent;
}
.cal-cell.empty{visibility:hidden;cursor:default}
/* tablets: the column widens (自動 caps it, 填滿螢幕 does not), more buttons share a row, calendar days stop being tall squares */
.wide-ui .app{max-width:1040px}
.wide-ui.full-ui .app{max-width:none}
.wide-ui .modal{max-width:720px}
.wide-ui .platform-grid,.wide-ui .expense-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.wide-ui.big-ui .platform-grid,.wide-ui.big-ui .expense-grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.wide-ui .cal-cell{aspect-ratio:auto;min-height:64px}
.cal-cell{min-width:0;overflow:hidden}
.cal-cell .n{max-width:100%;overflow:hidden;white-space:nowrap}
/* large type: seven columns must still fit the screen */
.big-ui .cal-grid{gap:2px}
.big-ui .cal-cell{border-radius:7px}
.cal-cell .d{font-family:'Space Grotesk';font-weight:700;font-size:12px}
.cal-cell .n{font-size:9px;font-family:'Space Grotesk';font-weight:700}
.cal-cell.pos{background:var(--income-soft)}
.cal-cell.pos .n{color:var(--income)}
.cal-cell.neg{background:var(--expense-soft)}
.cal-cell.neg .n{color:var(--expense)}
.cal-cell.holiday .d{color:var(--expense)}
.cal-cell.today{border-color:var(--accent)}
.cal-cell.selected{outline:2px solid var(--accent-strong);outline-offset:1px}

.segmented{display:flex;background:var(--surface-sunken);border-radius:12px;padding:3px;gap:3px;overflow-x:auto}
.segmented button{
  flex:1;border:none;background:none;padding:8px 6px;border-radius:9px;font-size:12px;font-weight:700;
  color:var(--text-muted);cursor:pointer;font-family:inherit;white-space:nowrap;
}
.segmented button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
/* large type: let the choices wrap onto a second row instead of hiding the last ones off-screen */
.big-ui .segmented{flex-wrap:wrap}
.big-ui .segmented button{flex:1 1 auto}

.progress-wrap{margin-top:6px}
.progress-lbl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.progress-lbl .p{color:var(--text-muted)}
.progress-lbl .v{font-family:'Space Grotesk';font-weight:700}
.progress-bar{height:8px;background:var(--surface-sunken);border-radius:5px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:5px}

.empty-state{text-align:center;padding:36px 14px;color:var(--text-muted)}
.empty-state .ic{font-size:30px;margin-bottom:8px}
.empty-state .t{font-size:13px}

.btn-row{display:flex;gap:8px}
.btn{flex:1;border:none;border-radius:12px;padding:11px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:var(--surface-sunken);color:var(--text)}
.btn-danger{background:var(--expense-soft);color:var(--expense)}
.add-fixed-btn{
  width:100%;border:1.5px dashed var(--border);background:none;border-radius:14px;padding:12px;
  color:var(--text-muted);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;
}

.modal-overlay{
  position:fixed;inset:0;background:rgba(20,17,12,.5);z-index:50;
  display:flex;align-items:flex-end;justify-content:center;
}
.modal{
  background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;
  padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:calc(88vh / var(--zoom, 1));overflow-y:auto;
  box-shadow:0 -4px 24px rgba(0,0,0,.2);
}
.set-sec{border:1px solid var(--border);border-radius:14px;margin-bottom:8px;background:var(--surface)}
.set-sec-hd{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:none;border:none;color:var(--text);font-family:inherit;text-align:left;cursor:pointer}
.set-sec-hd b{display:block;font-size:14.5px}
.set-sec-hd small{display:block;font-size:11.5px;color:var(--text-muted);margin-top:2px;font-weight:400;line-height:1.4}
.set-sec.open .set-sec-hd{border-bottom:1px solid var(--border)}
.set-chev{font-size:14px;color:var(--text-muted);flex:none}
.set-sec-bd{padding:8px 12px 12px}
.adv-sync{border:1px dashed var(--border);border-radius:12px;padding:10px 12px;margin-top:6px}
.adv-sync>summary{font-size:13px;font-weight:700;cursor:pointer;color:var(--text-muted)}
.set-sec-bd .form-grid2>*{min-width:0}
.set-sec-bd input:not([type=checkbox]):not([type=color]),.set-sec-bd select,.set-sec-bd textarea{max-width:100%;box-sizing:border-box}
.settings-save{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--surface);padding:10px 0 calc(12px + env(safe-area-inset-bottom,0px));margin-top:10px;border-top:1px solid var(--border);z-index:2}
.modal-title{font-size:16px;font-weight:900;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.modal-title .close{background:var(--surface-sunken);border:none;width:30px;height:30px;border-radius:9px;font-size:15px;cursor:pointer;color:var(--text)}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:6px}
.form-row input, .form-row select{
  width:100%;background:var(--surface-sunken);border:1px solid var(--border);border-radius:11px;
  padding:11px 12px;font-size:15px;color:var(--text);font-family:inherit;
}
.form-row input.num-input{font-family:'Space Grotesk';font-weight:700}
.form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid2 label{display:block;margin-bottom:6px}

.chip-row{display:flex;flex-wrap:wrap;gap:7px}
.chip-opt{
  border:1px solid var(--border);background:var(--surface-sunken);color:var(--text-muted);
  border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;
}
.chip-opt.selected{background:var(--accent);border-color:var(--accent);color:#fff}

.plat-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}
.plat-row:last-child{border-bottom:none}
.plat-row .li-del{flex:none}
.big-ui .plat-row{gap:5px}
.plat-row.dragging{opacity:.4}
.ord-btns{display:flex;flex-direction:column;gap:2px;flex:none}
.ord-btn{width:26px;height:20px;padding:0;border:1px solid var(--border);border-radius:5px;background:var(--surface-sunken);color:var(--text);font-size:11px;line-height:1;cursor:pointer;font-family:inherit}
.plat-drag-handle{cursor:grab;touch-action:none;color:var(--text-muted);font-size:16px;padding:4px 6px;flex:none;user-select:none}

.tag-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.tag{
  background:var(--surface-sunken);border:1px solid var(--border);border-radius:10px;
  padding:7px 10px;font-size:13px;display:flex;align-items:center;gap:7px;
}
.tag button{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:13px}

.donut-legend{display:flex;flex-direction:column;gap:7px;margin-top:2px}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px}
.chart-toggle{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex:none}
.chart-toggle button{background:none;border:none;color:var(--text-muted);font-family:inherit;font-size:11px;font-weight:700;padding:3px 9px;cursor:pointer}
.chart-toggle button.on{background:var(--accent);color:#fff}
.pie-wrap{display:flex;align-items:center;gap:14px}
.pie{width:108px;height:108px;border-radius:50%;flex:none;position:relative}
.pie::after{content:'';position:absolute;inset:27%;border-radius:50%;background:var(--surface)}
.share-track{height:6px;border-radius:3px;background:var(--surface-sunken);margin:3px 0 7px 16px;overflow:hidden}
.share-track>div{height:100%;border-radius:3px}
.legend-dot{width:9px;height:9px;border-radius:50%;flex:none}
.legend-row .lname{flex:1;color:var(--text-muted)}
.legend-row .lval{font-family:'Space Grotesk';font-weight:700}
</style>

</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <button class="brand-name" data-act="rename-app" style="background:none;border:none;padding:0;font:inherit;font-weight:900;font-size:19px;letter-spacing:.2px;cursor:pointer;color:inherit;display:flex;align-items:center;gap:6px">🚕 <span id="appNameLabel">跑車人生</span></button>
    </div>
    <div class="topbar-right">
      <span id="todayNet" class="today-net"></span>
      <button class="icon-btn backup-btn" id="backupBtn" data-act="quick-backup" title="備份" aria-label="備份" style="display:none">💾</button>
      <button class="icon-btn" data-act="open-settings" title="設定" aria-label="設定">⚙️</button>
    </div>
  </div>
  <main id="content" class="content"></main>
  <nav class="bottom-nav">
    <button class="nav-btn" data-act="tab:entry"><span class="ic">✏️</span>記帳</button>
    <button class="nav-btn" data-act="tab:history"><span class="ic">📅</span>歷史</button>
    <button class="nav-btn" data-act="tab:expense"><span class="ic">🧾</span>支出</button>
    <button class="nav-btn" data-act="tab:payout"><span class="ic">🏦</span>撥款</button>
    <button class="nav-btn" data-act="tab:analytics"><span class="ic">📊</span>分析</button>
  </nav>
</div>
<div id="modalRoot"></div>

<script>
function __taxiMain(){
'use strict';

var STORAGE_KEY = 'taxi_ledger_v2';
var CATS = [
  {key:'fuel',label:'加油',icon:'⛽'},
  {key:'parking',label:'停車費',icon:'🅿️'},
  {key:'toll',label:'E-Tag',icon:'🛣️'},
  {key:'wash',label:'洗車打蠟',icon:'🧽'},
  {key:'ticket',label:'罰單',icon:'🚫'},
  {key:'repair',label:'保養維修',icon:'🔧'},
  {key:'charge',label:'充電費',icon:'🔌'},
  {key:'fees',label:'規費',icon:'🏛️'},
  {key:'other',label:'其他',icon:'📝'}
];
var CAT_SUBS_DEFAULT = {repair:['輪胎','機油','定期保養','鈑金烤漆'], fees:['牌照稅','燃料稅','保險']};
var DOW = ['一','二','三','四','五','六','日'];

/* ---------- Taiwan 2026 official public holidays (行政院人事行政總處) ---------- */
var TW_HOLIDAY_BLOCKS_2026 = [
  {name:'元旦', from:'2026-01-01', to:'2026-01-01'},
  {name:'農曆春節', from:'2026-02-14', to:'2026-02-22'},
  {name:'和平紀念日', from:'2026-02-27', to:'2026-03-01'},
  {name:'兒童節及清明節', from:'2026-04-03', to:'2026-04-06'},
  {name:'勞動節', from:'2026-05-01', to:'2026-05-03'},

// 優惠以 5 元為單位捨去;貴賓無上限,其他每趟最多折 $300
function metroDiscount(gross, tier){
  var d = 0;
  if(tier==='婦派') d = gross>=100 ? gross*0.10 : 0;
  else if(tier==='海派') d = gross*(gross>=200 ? 0.15 : gross>=100 ? 0.10 : 0);
  else if(tier==='鑽派') d = gross*(gross>=300 ? 0.18 : gross>=200 ? 0.15 : gross>=100 ? 0.10 : 0);
  else if(tier==='超派') d = gross>100 ? (gross-100)*0.25 : 0;
  d = Math.floor(d/5 + 1e-9)*5;
  return tier==='婦派' ? d : Math.min(d, 300);
}
function yoxiNet(r, gross, fees){
  {
    var yoxiBase = fees.yoxiCash!=null?fees.yoxiCash:10;
    var yoxiCreditExtra = fees.yoxiCreditExtra!=null?fees.yoxiCreditExtra:2;
    if(r.fareType==='據點叫車'){
      var netStation = gross*(1-yoxiBase/100) - (+r.stationFee||0);
      return netStation>0?netStation:0;
    }
    if(r.fareType==='跳表'){
      if(r.payment==='企業簽單'){
        var discMap = {'原價':1,'95折':0.95,'92折':0.92,'85折':0.85};
        var mult = discMap[r.enterpriseDiscount]!=null ? discMap[r.enterpriseDiscount] : 1;
        return gross*mult*(1-yoxiBase/100);
      }
      if(r.payment==='信用卡'){
        return gross*(1-(yoxiBase+yoxiCreditExtra)/100);
      }
      return gross*(1-yoxiBase/100);
    }
    return gross*(1-yoxiBase/100);
  }
}
function computeGrossRevenue(r){ return grossBase(r) + (+r.tripBonus||0); }
function grossBase(r){
  var v = +r.revenue||0;
  if(v<=0) return 0;
  if(r.platform==='bonus') return v;
  var fees = r.fees||state.feeRules||{};
  if(r.platform==='uber' && !isUberTaxiRec(r)){
    var pctU = fees.uber!=null?fees.uber:25;
    return v/(1-pctU/100);
  }
  return v;
}
function describeRecord(r){
  var parts=[];
  if(r.platform==='bonus'){ if(r.bonusPlatform) parts.push(platformDef(r.bonusPlatform).label); if(r.bonusType) parts.push(r.bonusType); }
  if(r.subtype) parts.push(r.subtype);
  if(r.subPlatform) parts.push('→'+r.subPlatform);
  if(r.fareType) parts.push(r.fareType);
  if(r.discountTier && r.discountTier!=='原價') parts.push(r.discountTier);
  if(r.payment) parts.push(r.payment);
  if(r.enterpriseDiscount && r.enterpriseDiscount!=='原價') parts.push(r.enterpriseDiscount);
  if(r.estimateType) parts.push(r.estimateType);
  if(r.stationFee) parts.push('據點費$'+r.stationFee);
  if(r.markupMultiplier) parts.push('加成'+r.markupMultiplier+'倍');
  if(r.markupPercent) parts.push('加成'+r.markupPercent+'%');
  if(r.markupAmount) parts.push('加成$'+r.markupAmount);
  if(r.tipFx){ var fxn = FX_CURS.filter(function(c){ return c[0]===r.tipFx.cur; })[0]; parts.push('小費 '+r.tipFx.amt+' '+(fxn?fxn[1]:r.tipFx.cur)+'(×'+r.tipFx.rate+')'); }
  if(r.dispatchPct!=null) parts.push('派遣費'+r.dispatchPct+'%');
  if(r.tripBonus) parts.push('🎯活動+$'+r.tripBonus);
  if(r.addOn) parts.push('加價$'+r.addOn);
  if(r.coupon) parts.push('優惠券$'+r.coupon+(r.couponType==='absorb'?'(自己吸收)':'(平台補回)'));
  if(r.pickup && r.dropoff) parts.push('🚕'+Math.round((r.dropoff.ts-r.pickup.ts)/60000)+'分');
  if(r.area) parts.push('📍'+r.area);
  if(r.event) parts.push('🎉'+r.event);
  return parts.join(' · ');
}

var CLOUD_KEY_STORAGE = 'taxi_ledger_cloudkey';
var cloudAuthStatus = 'unknown';
// In the app the cloud password lives in the phone's protected storage (Android Keystore, see TaxiNativePlugin);
// a copy left in the web storage by an older version is moved there once and removed. The website, and an app
// whose protected storage fails, keep it in the web storage as before.
var cloudKeyMem = null;
function keyStore(){ var nt = nativeTools(); return nt && nt.setKey ? nt : null; }
function plainCloudKey(){ try{ return localStorage.getItem(CLOUD_KEY_STORAGE)||''; }catch(e){ return ''; } }
function dropPlainCloudKey(){ try{ localStorage.removeItem(CLOUD_KEY_STORAGE); }catch(e){} }
function loadCloudKey(){
  var plain = plainCloudKey(), ks = keyStore();
  if(!ks){ cloudKeyMem = plain; return Promise.resolve(); }
  return ks.getKey().then(function(r){
    var held = (r && r.value) || '';
    if(held){ cloudKeyMem = held; if(plain) dropPlainCloudKey(); return; }
    cloudKeyMem = plain;
    if(plain) return ks.setKey({value:plain}).then(dropPlainCloudKey, function(){});
  }, function(){ cloudKeyMem = plain; });
}
function getCloudKey(){ return cloudKeyMem!==null ? cloudKeyMem : plainCloudKey(); }
function setCloudKey(k){
  k = k || ''; cloudKeyMem = k;
  var ks = keyStore();
  function plainSave(){ try{ if(k) localStorage.setItem(CLOUD_KEY_STORAGE, k); else localStorage.removeItem(CLOUD_KEY_STORAGE); }catch(e){} }
  if(!ks){ plainSave(); return; }

}
function cloudAuthCheck(after){
  if(!state.syncUrl){ cloudAuthStatus='unknown'; if(after) after(); return; }
  cloudGet({action:'ping'}).then(function(res){
    var prev = cloudAuthStatus;
    if(res && res.ok && res.auth===true) cloudAuthStatus = 'ok';
    else if(res && res.error==='unauthorized') cloudAuthStatus = 'bad';
    else if(res && res.ok) cloudAuthStatus = 'open';
    else cloudAuthStatus = 'unreachable';
    if(res && res.ok) cloudServerV = +res.v || 0;
    if(cloudAuthStatus==='bad'){ state.lastCloudConfirmAt = 0; writeStore(); }
    if(prev==='bad' && cloudAuthStatus==='ok'){ state.lastCloudConfirmAt = 0; cloudSyncIfBehind(true); }

function cloudStatusText(){

    open:'⚠️ 雲端程式還沒啟用密碼(舊版),目前任何知道網址的人都能讀寫',

// the sheet answers no-cors posts with nothing we can read. So before sending, note which backups the sheet
// already has; afterwards only a backup that was not there before, with this snapshot's counts, proves it got saved.
// (an older backup with the same counts says nothing about an edited amount)
var cloudPushBusy = false, cloudPushAgain = false, cloudPushWaiters = [];
// Apps Script v6 stores each backup under the id the app gave it and reports a fingerprint (SHA-256) of the
// content it really stored. Only a matching id AND fingerprint is a full confirmation ('full'); an older
// script, or a browser that cannot compute the fingerprint, can only show the backup arrived ('basic').
// 'basic' never counts as backed up, so the backup-file reminder stays on.
var cloudServerV = 0;
// bumped when the destination, the password or the whole ledger changes: answers to older sends no longer count
var cloudGen = 0;
function newSnapshotId(){
  var a = new Uint32Array(3); (window.crypto||window.msCrypto).getRandomValues(a);
  return (Array.prototype.map.call(a, function(n){ return n.toString(36); }).join('') + Date.now().toString(36)).slice(0,20);
}
// '' when this browser cannot compute it
function sha256Hex(text){
  try{
    if(!(window.crypto && crypto.subtle && window.TextEncoder)) return Promise.resolve('');
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');
    }, function(){ return ''; });
  }catch(e){ return Promise.resolve(''); }
}
function withTimeout(p, ms){
  return new Promise(function(resolve, reject){
    var t = setTimeout(function(){ reject(new Error('timeout')); }, ms);
    p.then(function(v){ clearTimeout(t); resolve(v); }, function(e){ clearTimeout(t); reject(e); });
  });
}
function recordCloudResult(kind, builtAt, gen){

  if(kind==='basic' && builtAt > (state.lastCloudBasicAt||0)) state.lastCloudBasicAt = builtAt;

function confirmBySnapshot(sid, hash, builtAt, gen, onResult, retried){

    var hit = vs.filter(function(v){ return v.sid===sid; })[0];
    // the sheet's list can lag a moment behind the save
    if(!hit && !retried){ setTimeout(function(){ confirmBySnapshot(sid, hash, builtAt, gen, onResult, true); }, 4000); return; }
    var kind = !hit ? '' : (hash && hit.hash) ? (hit.hash===hash ? 'full' : '') : 'basic';
    recordCloudResult(kind, builtAt, gen);
    writeStore();

function cloudListVersions(){

// scripts before v6: a new backup with this snapshot's counts showed up, which is not proof of its content

    if(ok) recordCloudResult('basic', builtAt, gen);

function canSyncLedger(){ return hasMeaningfulData() || state.hadData===true; }
// one send at a time, so two overlapping sends cannot claim each other's backup; a change made meanwhile goes in the next one.
// onResult(ok, kind): ok only for a full confirmation
function pushCloudSnapshot(onResult){
  if(!state.syncUrl || cloudSyncSuspended || storageStale || !canSyncLedger()) return false;
  if(onResult) cloudPushWaiters.push(onResult);
  if(cloudPushBusy){ cloudPushAgain = true; return true; }
  cloudPushBusy = true;
  var waiters = cloudPushWaiters.splice(0), gen = cloudGen;
  function done(ok, kind){
    cloudPushBusy = false;
    var full = ok===true && kind==='full';
    waiters.forEach(function(f){ try{ f(full, kind||''); }catch(e){} });
    if(full) cloudRetryN = 0; else scheduleCloudRetry();
    if(cloudPushAgain){ cloudPushAgain = false; pushCloudSnapshot(); }

    return withTimeout(fetch(state.syncUrl, {
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(snap)

  }
  if(cloudServerV >= 6){
    snap.snapshotId = newSnapshotId();
    sha256Hex(snap.state).then(function(hash){
      return post().then(function(){
        if(cloudAuthStatus==='bad'){ done(false); return; }
        state.lastCloudSendAt = builtAt;
        confirmBySnapshot(snap.snapshotId, hash, builtAt, gen, done);

    }).catch(function(){ done(false); });

    vs.forEach(function(v){ before[+v.time] = true; });

    // without the list we still send (it may get through), but it cannot be confirmed
    return post().then(function(){

      state.lastCloudSendAt = builtAt;
      if(!before){ writeStore(); done(false); return; }

// Automatic backups go out at most once per chosen interval (each one is a file in the driver's Drive),

var cloudCbSeq = 0;
// Apps Script v6 answers a plain request with JSON that any page may read, so that is what is used. Only the website
// still falls back to the old script-tag way (JSONP) for older Apps Script copies that answer nothing else; the
// app never loads the cloud's answer as a script.
function cloudGet(params){
  var q = Object.keys(params).map(function(k){ return k+'='+encodeURIComponent(params[k]); }).join('&');
  var url = state.syncUrl+(state.syncUrl.indexOf('?')>=0?'&':'?')+q+'&key='+encodeURIComponent(getCloudKey());
  return withTimeout(fetch(url, {method:'GET', cache:'no-store', credentials:'omit'}), 30000).then(function(r){
    if(!r.ok) throw new Error('http '+r.status);
    return r.text();
  }).then(function(t){ return JSON.parse(t); }).catch(function(err){
    if(isNativeApp()) throw err;
    return cloudGetJsonp(params);
  });
}
function cloudGetJsonp(params){
  return new Promise(function(resolve, reject){
    var cb = '__cloudCb'+(++cloudCbSeq)+'_'+Date.now();
    var q = Object.keys(params).map(function(k){ return k+'='+encodeURIComponent(params[k]); }).join('&');
    var s = document.createElement('script');
    var timer = setTimeout(function(){ cleanup(); reject(new Error('timeout')); }, 30000);
    function cleanup(){ clearTimeout(timer); try{ delete window[cb]; }catch(e){ window[cb]=undefined; } if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = function(data){ cleanup(); resolve(data); };
    s.onerror = function(){ cleanup(); reject(new Error('load')); };
    s.src = state.syncUrl+(state.syncUrl.indexOf('?')>=0?'&':'?')+q+'&key='+encodeURIComponent(getCloudKey())+'&callback='+cb;
    document.head.appendChild(s);
  });
}

/* ---------- computations ---------- */
function dataFirstDate(){
  var first = null;
  function consider(d){ if(d && (!first || d<first)) first=d; }
  state.records.forEach(function(r){ consider(r.date); });
  state.expenses.forEach(function(e){ consider(e.date); });
  Object.keys(state.dailyMeta).forEach(function(d){ var m=state.dailyMeta[d]; if(m.km!=null || m.workedMs>0) consider(d); });
  return first;
}
function inRange(dateStr, from, to){ return dateStr>=from && dateStr<=to; }
function recordsInRange(from,to){ return state.records.filter(function(r){return inRange(r.date,from,to);}); }
function expensesInRange(from,to){ return state.expenses.filter(function(e){return inRange(e.date,from,to);}); }

function sumIncome(recs){
  var rev=0, tip=0;
  recs.forEach(function(r){ rev+=computeGrossRevenue(r); tip+=(+r.tip||0); });
  return {rev:rev, tip:tip, total:rev+tip};
}
function sumNetIncome(recs){
  var net=0, tip=0;
  recs.forEach(function(r){ net+=computeNetRevenue(r); tip+=(+r.tip||0); });
  return {net:net, tip:tip, total:net+tip};
}
function sumExpense(exps){
  var t=0; exps.forEach(function(e){ t+=(+e.amount||0); }); return t;
}
function monthsBetween(from,to){
  var months=[]; var a=new Date(from+'T00:00:00'); var b=new Date(to+'T00:00:00');
  var cur=new Date(a.getFullYear(),a.getMonth(),1);
  var end=new Date(b.getFullYear(),b.getMonth(),1);
  while(cur<=end){ months.push(cur.getFullYear()+'-'+pad(cur.getMonth()+1)); cur.setMonth(cur.getMonth()+1); }
  return months;
}
function fixedCostForMonth(fc, ym){
  var ov = state.fixedOverrides[ym] && state.fixedOverrides[ym][fc.id];
  if(ov!=null) return +ov;
  return fc.freq==='yearly' ? (+fc.amount||0)/12 : (+fc.amount||0);
}
function fixedTotalForRange(from,to){
  var months = monthsBetween(from,to);
  var total=0;
  var fromD = new Date(from+'T00:00:00');
  var toD = new Date(to+'T00:00:00');
  months.forEach(function(ym){
    var y = +ym.slice(0,4), m = +ym.slice(5,7)-1;
    var mDays = new Date(y,m+1,0).getDate();
    var monthStart = new Date(y,m,1);
    var monthEnd = new Date(y,m,mDays);
    var rangeStart = fromD > monthStart ? fromD : monthStart;
    var rangeEnd = toD < monthEnd ? toD : monthEnd;
    var overlapDays = Math.round((rangeEnd - rangeStart)/86400000) + 1;
    if(overlapDays < 0) overlapDays = 0;
    var monthTotal = 0;
    state.fixedCosts.forEach(function(fc){ monthTotal += fixedCostForMonth(fc, ym); });
    total += monthTotal * (overlapDays / mDays);
  });
  return total;
}
function totalKmInRange(from,to){
  var t=0;
  Object.keys(state.dailyMeta).forEach(function(d){ if(inRange(d,from,to)) t += (+state.dailyMeta[d].km||0); });
  return t;
}
function totalHoursInRange(from,to){
  var t=0; var today=todayStr();
  Object.keys(state.dailyMeta).forEach(function(d){
    if(inRange(d,from,to)){
      var m = state.dailyMeta[d];
      var wm = m.workedMs!=null? m.workedMs : (m.hours? m.hours*3600000:0);
      if(d===today && m.segmentStart) wm += (Date.now()-m.segmentStart);
      t += wm/3600000;
    }
  });
  return t;
}
function totalBreakHoursInRange(from,to){
  var t=0; var today=todayStr();
  Object.keys(state.dailyMeta).forEach(function(d){
    if(inRange(d,from,to)){
      var m = state.dailyMeta[d];
      var bm = m.breakMs||0;
      if(d===today && m.onBreak && m.breakStart) bm += (Date.now()-m.breakStart);
      t += bm/3600000;
    }
  });
  return t;
}
function workingDayListInRange(from,to){
  var days = {};
  state.records.forEach(function(r){ if(inRange(r.date,from,to)) days[r.date]=true; });
  Object.keys(state.dailyMeta).forEach(function(d){
    if(inRange(d,from,to)){
      var m = state.dailyMeta[d];
      if((m.workedMs && m.workedMs>0) || m.activeShiftStart) days[d]=true;
    }
  });
  return Object.keys(days).sort();
}
function workingDaysInRange(from,to){ return workingDayListInRange(from,to).length; }
// Only working days on/after the first day the counter was used count, so days before the feature existed don't read as "0 次"
function toiletStatsInRange(from,to){
  var tracked = Object.keys(state.dailyMeta).filter(function(d){ return state.dailyMeta[d].toilet!=null; }).sort();
  var since = tracked[0] || null;
  var out = {since:since, days:0, total:0, zeroDays:0, hours:0};
  if(!since) return out;
  workingDayListInRange(since>from?since:from, to).forEach(function(d){
    var c = (state.dailyMeta[d] && state.dailyMeta[d].toilet) || 0;
    out.days++; out.total += c; if(!c) out.zeroDays++;
    out.hours += totalHoursInRange(d,d) + totalBreakHoursInRange(d,d);
  });
  return out;
}
function chargeStatsInRange(from,to){

function breakdownLabel(r){
  var parts=[];
  if(r.platform==='bonus'){ if(r.bonusPlatform) parts.push(platformDef(r.bonusPlatform).label); if(r.bonusType) parts.push(r.bonusType); }
  if(r.subtype) parts.push(r.subtype);
  if(r.subPlatform) parts.push('→'+r.subPlatform);
  if(r.fareType) parts.push(r.fareType);
  if(r.discountTier && r.discountTier!=='原價') parts.push(r.discountTier);
  if(r.payment) parts.push(r.payment);
  if(r.enterpriseDiscount && r.enterpriseDiscount!=='原價') parts.push(r.enterpriseDiscount);
  if(r.estimateType) parts.push(r.estimateType);
  return parts.join(' · ');
}
function subBreakdown(recs){

    var val = computeNetRevenue(r)+(+r.tip||0);
    if(!map[label]) map[label]={count:0,total:0,ids:[]};
    map[label].count++; map[label].total+=val; map[label].ids.push(r.id);
  });
  return Object.keys(map).map(function(k){return {label:k,count:map[k].count,total:map[k].total,ids:map[k].ids};}).sort(function(a,b){return b.total-a.total;});

function weekRange(){
  var t = new Date(todayStr()+'T00:00:00');
  var day = (t.getDay()+6)%7;
  var mon = new Date(t); mon.setDate(t.getDate()-day);
  var sun = new Date(mon); sun.setDate(mon.getDate()+6);
  return {from:toDateStr(mon), to:toDateStr(sun)};
}
function monthRange(m){
  var y=m.getFullYear(), mo=m.getMonth();
  var from = y+'-'+pad(mo+1)+'-01';
  var last = new Date(y,mo+1,0).getDate();
  var to = y+'-'+pad(mo+1)+'-'+pad(last);
  return {from:from, to:to};
}

/* ---------- payouts: cash vs platform, batches, reconciliation ---------- */
var WEEKDAY_NAMES = ['一','二','三','四','五','六','日'];
var PAYOUT_DEFAULTS = {
  uber:{collect:'platform', schedule:'weekly', weekday:3, days:2, cashFeeFromPayout:true},
  bolt:{collect:'platform', schedule:'weekly', weekday:4, days:2, cashFeeFromPayout:true},
  tdc:{collect:'platform', schedule:'tplus', weekday:3, days:2, cashFeeFromPayout:true},
  metro:{collect:'platform', schedule:'tplus', weekday:3, days:2, cashFeeFromPayout:true},
  yoxi:{collect:'platform', schedule:'map', map:[7,6,5,7,6,5,4], shift:'period', weekday:3, days:2, cashFeeFromPayout:true},
  linego:{collect:'platform', schedule:'map', map:[8,7,6,8,7,6,5], weekday:3, days:2, cashFeeFromPayout:true},
  hailyellow:{collect:'cash', schedule:'tplus', weekday:3, days:2, cashFeeFromPayout:false}
};
// one-time: BOLT pays weekly on Thursday; earlier saves of 撥款設定 stored it as unset
if(!state.boltPayoutThuSet){
  var boltOv = (state.payoutSettings||{}).bolt;
  if(boltOv && boltOv.schedule==='unset'){ boltOv.schedule = 'weekly'; boltOv.weekday = 4; }
  state.boltPayoutThuSet = true;
}
// one-time: 大都會 pays like 台灣大車隊, the 2nd bank day after the trip
if(!state.metroTplusSet){
  var metroOv = (state.payoutSettings||{}).metro;
  if(metroOv && metroOv.schedule==='unset'){ metroOv.schedule = 'tplus'; metroOv.days = 2; }
  state.metroTplusSet = true;
}
// one-time: YOXI (official FAQ) pays next Mon for Mon–Wed and next Thu for Thu–Sun, a holiday pushes it to the next payday;
// LINE GO pays next Tue (Mon–Wed) and next Fri (Thu–Sun)
if(!state.twicePayMapSet){
  var twiceMaps = {yoxi:[7,6,5,7,6,5,4], linego:[8,7,6,8,7,6,5]}, twiceShift = {yoxi:'period', linego:'bank'};
  Object.keys(twiceMaps).forEach(function(k){
    var ov = (state.payoutSettings||{})[k];
    // also catches a map saved untouched with the generic default before these were known
    var untouched = ov && ov.schedule==='map' && (!ov.map || ov.map.join()==='2,2,2,4,4,3,2');
    if(ov && (ov.schedule==='unset' || untouched)){ ov.schedule = 'map'; ov.map = twiceMaps[k]; ov.shift = twiceShift[k]; }
  });
  state.twicePayMapSet = true;
}
// 依星期對照: days after the trip's settlement day, Monday first
var PAY_MAP_DEFAULT = [2,2,2,4,4,3,2];
// older saves stored the holiday rule as a checkbox
function shiftMode(v){ return v===true ? 'bank' : (v===false ? 'none' : (v || 'bank')); }
// platforms close a day at midnight, Uber at 04:00; this is separate from the person's own 營業日分界
function settleCutoffHour(key){ return key==='uber' ? 4 : 0; }
function settleDateOf(r){
  var ts = (r.dropoff && r.dropoff.ts) || (r.pickup && r.pickup.ts) || null;
  if(!ts && r.ts && businessDayOf(r.ts)===r.date) ts = r.ts;
  if(!ts) return r.date;
  return toDateStr(new Date(ts - settleCutoffHour(payKey(r))*3600000));
}
function payoutCfg(key){
  var base = PAYOUT_DEFAULTS[key] || {collect:'cash', schedule:'none', weekday:3, days:2, cashFeeFromPayout:true};
  base = Object.assign({map:PAY_MAP_DEFAULT, shift:true}, base);
  var ov = (state.payoutSettings||{})[key] || {};
  var out = {};
  for(var k in base) out[k] = (ov[k]!=null) ? ov[k] : base[k];
  return out;
}
function isCashRecord(r){
  if(r.platform==='bonus') return payoutCfg(payKey(r)).collect==='cash' && !platformDef(payKey(r)).paymentOptions;
  var def = platformDef(r.platform);
  if(!r.payment && ['reservation','phonecall','hailyellow'].indexOf(r.platform)>=0) return payoutCfg(r.platform).collect==='cash';
  if(def.paymentOptions || isUberTaxiRec(r)){
    if(r.payment) return r.payment==='現金';
    return r.fareType==='據點叫車';
  }
  return payoutCfg(r.platform).collect==='cash';
}
function moneyFlow(r){
  var tip = +r.tip||0;
  var net = computeNetRevenue(r);
  var cfg = payoutCfg(payKey(r));
  var coupon = r.coupon>0 ? +r.coupon : 0;
  if(isCashRecord(r)){
    var fee = Math.max(0, (+r.revenue||0) - netBeforeCoupon(r));
    var netted = cfg.cashFeeFromPayout && cfg.schedule!=='none';
    // the passenger paid the coupon part with the platform's money: less cash, and the platform owes it
    return {cash:(+r.revenue||0)-coupon+tip, noncash:(r.couponType==='absorb'?0:coupon)+(+r.tripBonus||0), cashFee:fee, netted:netted};
  }
  return {cash:0, noncash:net+tip, cashFee:0, netted:false};
}
function cashSummary(recs){
  var cash=0, noncash=0, feeNetted=0, feeSep=0;
  recs.forEach(function(r){
    var f=moneyFlow(r);
    cash+=f.cash; noncash+=f.noncash;
    if(f.cashFee){ if(f.netted) feeNetted+=f.cashFee; else feeSep+=f.cashFee; }
  });
  return {cash:cash, noncash:noncash, feeNetted:feeNetted, feeSeparate:feeSep};
}
function isBankDay(ds){
  var dow = new Date(ds+'T00:00:00').getDay();
  return dow!==0 && dow!==6 && !TW_HOLIDAYS[ds];
}
function weekMonday(ds){
  var d = new Date(ds+'T00:00:00');
  d.setDate(d.getDate()-((d.getDay()+6)%7));
  return toDateStr(d);
}
function payoutBatchOf(r){
  var pk = payKey(r), cfg = payoutCfg(pk);
  if(cfg.schedule==='none') return null;
  var sd = settleDateOf(r);
  if(cfg.schedule==='weekly'){
    var payDate = addDays(weekMonday(sd), 7 + ((+cfg.weekday||3)-1));
    return {id:pk+'|'+payDate, payDate:payDate};
  }
  if(cfg.schedule==='map'){
    var wd = (new Date(sd+'T00:00:00').getDay()+6)%7;
    var pd = addDays(sd, +((cfg.map||PAY_MAP_DEFAULT)[wd]) || 2);
    var mode = shiftMode(cfg.shift);
    if(mode==='bank') while(!isBankDay(pd)) pd = addDays(pd,1);
    else if(mode==='period'){
      // skip to the platform's next regular payday that is a bank day
      var paydays = {}; (cfg.map||PAY_MAP_DEFAULT).forEach(function(off,i){ paydays[(i+(+off||0))%7] = true; });
      while(!isBankDay(pd) || !paydays[(new Date(pd+'T00:00:00').getDay()+6)%7]) pd = addDays(pd,1);
    }
    return {id:pk+'|'+pd, payDate:pd};
  }
  if(cfg.schedule==='tplus'){
    var d = sd, left = Math.max(0, +cfg.days||0);
    while(left>0){ d = addDays(d,1); if(isBankDay(d)) left--; }
    while(!isBankDay(d)) d = addDays(d,1);
    return {id:pk+'|'+d, payDate:d};
  }
  var mon = weekMonday(sd);
  return {id:pk+'|wk'+mon, payDate:null, weekFrom:mon};
}
var payoutMemo = null;
function payoutLedger(){
  // also redone every 10 minutes: what is due depends on the clock
  var tick = Math.floor(Date.now()/600000);
  if(payoutMemo && payoutMemo.gen===dataGen && payoutMemo.st===state && payoutMemo.tick===tick) return payoutMemo.val;
  var val = payoutLedgerCompute();
  payoutMemo = {gen:dataGen, st:state, tick:tick, val:val};
  return val;
}
function payoutLedgerCompute(){
  var byPlat = {};
  state.records.forEach(function(r){
    var pk = payKey(r), cfg = payoutCfg(pk);
    if(cfg.schedule==='none') return;
    (byPlat[pk] = byPlat[pk] || []).push(r);
  });
  var map = {}, owedByPlatform = {};
  Object.keys(byPlat).forEach(function(pk){
    var recs = byPlat[pk].map(function(r){ return {r:r, sd:settleDateOf(r)}; }).sort(function(a,b){ return a.sd<b.sd?-1:(a.sd>b.sd?1:(a.r.ts||0)-(b.r.ts||0)); });
    var owed = 0;
    recs.forEach(function(x){
      var r = x.r, f = moneyFlow(r);
      if(f.cashFee && f.netted) owed += f.cashFee;
      if(!f.noncash) return;
      var b = payoutBatchOf(r); if(!b) return;
      var ded = Math.min(owed, f.noncash);
      owed -= ded;
      if(!map[b.id]) map[b.id] = {id:b.id, platform:pk, payDate:b.payDate, weekFrom:b.weekFrom||null, expected:0, trips:0, from:x.sd, to:x.sd, earned:0, cashFees:0};
      var m = map[b.id];
      m.earned += f.noncash; m.cashFees += ded; m.expected += f.noncash-ded;
      if(r.platform==='bonus') m.bonus = (m.bonus||0) + f.noncash; else m.trips++;
      if(x.sd<m.from) m.from=x.sd;
      if(x.sd>m.to) m.to=x.sd;
    });
    if(owed>0.5) owedByPlatform[pk] = owed;
  });
  var paid = {};
  (state.payouts||[]).forEach(function(p){ paid[p.batch] = p; });
  var batches = Object.keys(map).map(function(k){ var b=map[k]; b.payout = paid[k]||null; return b; });
  return {batches:batches, owed:owedByPlatform};
}
function payoutBatches(){ return payoutLedger().batches; }
function shortDate(ds){ return ds.slice(5).replace('-','/'); }
function batchTitle(b){
  var name = platformDef(b.platform).label;
  if(b.payDate) return name+' · '+shortDate(b.payDate)+'(週'+WEEKDAY_NAMES[(new Date(b.payDate+'T00:00:00').getDay()+6)%7]+')撥款';
  return name+' · '+shortDate(b.weekFrom)+' 那一週';

function renderPayoutTab(){

  var done = all.filter(function(b){ return b.payout; }).sort(function(a,b){ return (a.payDate||a.weekFrom)<(b.payDate||b.weekFrom)?1:-1; });

      '<div style="font-size:12px;color:var(--text-muted);margin-top:4px;line-height:1.6">'+owedKeys.map(function(k){ return esc(platformDef(k).label)+' '+fmtMoney(ledger.owed[k]); }).join(' · ')+'<br>會從之後的非現金單撥款裡扣回去。</div></div></div>';
  }

  h += '<div class="btn-row" style="margin-bottom:14px"><button class="btn btn-ghost" data-act="open-payout-settings">⚙️ 撥款設定(各平台撥款時間)</button></div>';
  if(due.length) h += '<div class="section"><div class="section-title">已到撥款日,請確認有沒有入帳</div><div class="card">'+due.map(function(b){ return batchRowHtml(b); }).join('')+'</div></div>';

  if(!all.length) h += '<div class="card"><div class="empty-state"><div class="ic">🏦</div><div class="t">還沒有需要平台撥款的記錄</div></div></div>';
  return h;
}
function openPayoutModal(batchId){
  var b = payoutBatches().filter(function(x){ return x.id===batchId; })[0];

/* ---------- trips: pickup / dropoff with one-shot GPS ---------- */
var pendingIncomeTripId = null;
function hhmm(ts){ var d=new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function tripMinutes(t){ return (t.pickup && t.dropoff) ? Math.max(0,(t.dropoff.ts-t.pickup.ts)/60000) : null; }
function tripLabel(t){
  var m = tripMinutes(t);
  return hhmm(t.pickup.ts)+(t.dropoff?(' → '+hhmm(t.dropoff.ts)):' → 載客中')+(m!=null?(' · '+Math.round(m)+' 分鐘'):'');

function showToast(msg, ms){

  if(!el){
    el = document.createElement('div'); el.id = 'appToast';
    el.style.cssText = 'position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:340px;width:calc(100% - 32px);background:var(--text);color:var(--bg);padding:11px 14px;border-radius:12px;font-size:13px;line-height:1.5;z-index:200;box-shadow:var(--shadow);text-align:center';
    document.body.appendChild(el);
  }
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(el._t); el._t = setTimeout(function(){ el.style.display='none'; }, ms||3500);
}
function geoCapture(cb){
  if(!navigator.geolocation){ cb(null, '這支手機的瀏覽器不支援定位,這趟只記時間。'); return; }
  var done = false;
  navigator.geolocation.getCurrentPosition(function(p){
    if(done) return; done = true;
    cb({lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6), acc:Math.round(p.coords.accuracy||0)}, '');
  }, function(err){
    if(done) return; done = true;
    if(err && err.code===1) cb(null, '定位權限被拒絕,這趟只記時間。要記位置:iPhone「設定 → 隱私權與安全性 → 定位服務」打開,再回 App 按上車時選「允許」。');
    else cb(null, '這次抓不到位置(可能訊號不好),這趟只記時間,記帳照常。');
  }, {enableHighAccuracy:true, timeout:10000, maximumAge:15000});
}
function applyTripLoc(tripId, which, loc, ts){
  if(!loc) return;
  // ts guards against a late fix landing on a dropoff that was undone and pressed again
  function setOn(pt){ if(pt && (ts==null || pt.ts===ts)){ pt.lat=loc.lat; pt.lng=loc.lng; pt.acc=loc.acc; } }
  if(state.activeTrip && state.activeTrip.id===tripId) setOn(state.activeTrip[which]);
  (state.pendingTrips||[]).forEach(function(t){ if(t.id===tripId) setOn(t[which]); });
  state.records.forEach(function(r){ if(r.tripId===tripId) setOn(r[which]); });
  save();
}
function captureFor(tripId, which, ts, note){
  state.geoAsked = true;
  geoCapture(function(loc, msg){
    if(loc){
      applyTripLoc(tripId, which, loc, ts);
      showToast((which==='pickup'?'上車':'下車')+'位置已記錄(誤差約 '+loc.acc+' 公尺)'+(note||''), note?5000:3500);
    } else {
      showToast(msg+(note||''), 7000);
    }
  });
}
// a fare means the shift is running: clock in or end the break so hours aren't lost
function ensureShiftRunning(now){
  if(!uiOn('shift')) return '';
  var sm = dm(todayStr());
  if(!sm.activeShiftStart && !findStaleOpenShiftDate()){
    sm.activeShiftStart = now; sm.segmentStart = now; sm.onBreak = false;
    return '(忘了打上班卡,已自動幫你打卡)';
  }
  if(sm.onBreak && sm.breakStart){
    sm.breakMs += (now-sm.breakStart); sm.breakStart = null; sm.onBreak = false; sm.segmentStart = now;
    return '(休息已自動結束)';
  }
  return '';
}
function tripAccept(){
  if(state.activeTrip || state.pendingAccept) return;
  var now = Date.now(), note = ensureShiftRunning(now);
  state.pendingAccept = {ts:now};
  save(function(ok){ if(ok) showToast('已記錄接單時間,到上車點客人上車再按「上車」'+note, note?5000:3500); }); renderAll();
  geoCapture(function(loc){
    if(!loc) return;
    // the fix can land after 上車 was already pressed, so look for this accept wherever it went
    var hits = [state.pendingAccept, state.activeTrip && state.activeTrip.accept].concat((state.pendingTrips||[]).map(function(t){ return t.accept; })).concat(state.records.map(function(r){ return r.accept; }));
    hits.forEach(function(a){ if(a && a.ts===now){ a.lat = loc.lat; a.lng = loc.lng; a.acc = loc.acc; } });
    save();
  });
}
function tripStart(){
  if(state.activeTrip) return;
  var now = Date.now(), note = ensureShiftRunning(now);
  var t = {id:uid(), pickup:{ts:now}};
  if(state.pendingAccept){ t.accept = state.pendingAccept; state.pendingAccept = null; }
  state.activeTrip = t;
  save(function(ok){ if(ok) showToast('已記錄上車時間,定位中…'+note, note?5000:3500); }); renderAll();
  captureFor(t.id, 'pickup', null, note);
}
function tripEnd(){
  var t = state.activeTrip; if(!t) return;
  t.dropoff = {ts:Date.now()};
  state.activeTrip = null;
  state.pendingTrips = state.pendingTrips || [];
  state.pendingTrips.push(t);
  save(); renderAll();
  captureFor(t.id, 'dropoff', t.dropoff.ts);
  openTripLinkModal(t.id);
}
function tripResume(tripId){
  if(state.activeTrip){ alert('現在已經有一趟載客中,要先處理那一趟才能恢復。'); return; }
  var t = findPendingTrip(tripId); if(!t) return;
  delete t.dropoff;
  state.pendingTrips = (state.pendingTrips||[]).filter(function(x){ return x.id!==t.id; });
  state.activeTrip = t;

function tripChoiceHtml(existing){
  if(existing && existing.tripId){
    var m = (existing.pickup && existing.dropoff) ? Math.round((existing.dropoff.ts-existing.pickup.ts)/60000) : null;
    return '<div class="form-row"><label>行程</label><div style="font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px"><span>🚕 '+hhmm(existing.pickup.ts)+' → '+(existing.dropoff?hhmm(existing.dropoff.ts):'?')+(m!=null?(' · '+m+' 分鐘'):'')+'</span><a data-act="unlink-trip:'+existing.id+'" style="font-size:12px;color:var(--text-muted);cursor:pointer;text-decoration:underline">取消連結</a></div></div>';
  }
  var opts = [];
  (state.pendingTrips||[]).slice().reverse().slice(0,3).forEach(function(t){ opts.push({id:t.id, label:tripLabel(t)}); });
  if(state.activeTrip) opts.push({id:state.activeTrip.id, label:hhmm(state.activeTrip.pickup.ts)+' 上車中(存檔時一併下車)'});
  if(!opts.length) return '';
  var def = 'none';
  if(pendingIncomeTripId) def = pendingIncomeTripId;
  else if(!existing){
    var last = (state.pendingTrips||[]).slice(-1)[0];
    if(last && Date.now()-last.dropoff.ts < 60*60000) def = last.id;
    else if(state.activeTrip) def = state.activeTrip.id;
  }
  opts.push({id:'none', label:'不連行程'});
  var h = '<div class="form-row"><label>連到行程</label><div class="chip-row">';
  opts.forEach(function(o){ h += '<button type="button" class="chip-opt'+(o.id===def?' selected':'')+'" data-act="trip-pick:'+o.id+'">'+esc(o.label)+'</button>'; });
  h += '</div><input type="hidden" id="f-trip-link" value="'+def+'"></div>';
  return h;
}
function applyTripChoiceOnSave(rec){
  var el = document.getElementById('f-trip-link');
  var choice = el ? el.value : 'none';
  if(!choice || choice==='none') return;
  var t = findPendingTrip(choice);
  if(t){ attachTripToRecord(t, rec); return; }
  if(state.activeTrip && state.activeTrip.id===choice){
    var a = state.activeTrip;
    a.dropoff = {ts:Date.now()};
    state.activeTrip = null;
    rec.tripId = a.id; rec.pickup = a.pickup; rec.dropoff = a.dropoff;
    if(a.accept) rec.accept = a.accept;
    setTimeout(function(){ captureFor(a.id, 'dropoff'); }, 0);
  }
}
function tripSheetCols(r){
  var p = r.pickup||{}, d = r.dropoff||{};
  var mins = (r.pickup && r.dropoff) ? Math.round((d.ts-p.ts)/6000)/10 : '';
  return [p.ts?fmtTsSec(p.ts):'', p.lat!=null?p.lat:'', p.lng!=null?p.lng:'', p.acc!=null?p.acc:'',
          d.ts?fmtTsSec(d.ts):'', d.lat!=null?d.lat:'', d.lng!=null?d.lng:'', d.acc!=null?d.acc:'', mins];
}
function fmtTsSec(ts){ var d=new Date(ts); return toDateStr(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }

  if(currentTab==='entry') c.innerHTML = renderEntry();
  else if(currentTab==='history') c.innerHTML = renderHistory();
  else if(currentTab==='expense') c.innerHTML = renderExpenseTab();

// red count on 撥款 for batches whose payday has passed without the amount being confirmed
function renderPayoutBadge(){
  var ic = document.querySelector('.nav-btn[data-act="tab:payout"] .ic'); if(!ic) return;
  var today = todayStr();
  var n = payoutBatches().filter(function(b){ return !b.payout && b.payDate && b.payDate<=today; }).length;
  var badge = ic.querySelector('.nav-badge');
  if(!n){ if(badge) badge.remove(); return; }
  if(!badge){ badge = document.createElement('i'); badge.className = 'nav-badge'; ic.appendChild(badge); }
  badge.textContent = n>9 ? '9+' : n;

function renderTopbar(){
  var t = todayStr();

var HOME_BLOCKS = [
  ['stats','今日實收/車資/支出'],
  ['trips','上車/下車按鈕','trips'],
  ['platforms','收入/平台按鈕'],
  ['traffic','看即時路況、常用地點','traffic'],
  ['campaign','活動獎勵','campaign'],
  ['cashFlow','今日現金收入/待撥款','cashFlow'],
  ['target','今日目標','todayTarget'],

  ['dayList','今日明細',null,true]
];
function homeOrder(){
  var def = HOME_BLOCKS.map(function(b){ return b[0]; });
  var saved = (state.homeOrder||[]).filter(function(k){ return def.indexOf(k)>=0; });
  def.forEach(function(k, i){ if(saved.indexOf(k)<0) saved.splice(Math.min(i, saved.length), 0, k); });
  return saved;
}
function homeHidden(k){ return !!(state.homeHide && state.homeHide[k]); }

function renderDayList(dateStr){
  var recs = state.records.filter(function(r){return r.date===dateStr;}).sort(function(a,b){return b.ts-a.ts;});
  var exps = state.expenses.filter(function(e){return e.date===dateStr;}).sort(function(a,b){return b.ts-a.ts;});
  if(!recs.length && !exps.length) return '<div class="empty-state"><div class="ic">🗒️</div><div class="t">這天還沒有記錄</div></div>';
  var h='';
  recs.forEach(function(r){
    var net = computeNetRevenue(r);
    var grossEst = computeGrossRevenue(r);
    var fee = grossEst-net-(r.couponType==='absorb' ? (+r.coupon||0) : 0);
    var amt = net+(+r.tip||0);
    var desc = describeRecord(r);
    var parts = [];
    if(desc && uiShow('recDesc')) parts.push(esc(desc));
    if(grossEst) parts.push((r.platform==='bonus'?'金額 ':isUberNetRec(r)?'估算車資 ':'車資 ')+fmtMoney(grossEst-(+r.tripBonus||0)));
    if(fee>0.5) parts.push((isUberNetRec(r)?'估算抽成 ':'抽成 ')+fmtMoney(fee));
    if(r.tip) parts.push('小費 '+fmtMoney(r.tip));
    if(r.note) parts.push(esc(r.note));
    var subLine = parts.join(' · ');
    h += '<div class="list-item">'+
      '<div class="li-icon" style="background:var(--income-soft);color:var(--income)">🚕</div>'+
      '<div class="li-body" data-act="edit-income:'+r.id+'" style="cursor:pointer"><div class="li-title">'+esc(platformDef(r.platform).label)+'</div><div class="li-sub">'+subLine+'</div></div>'+
      '<div class="li-amt income num">+'+fmtMoneyFor(r.platform, amt)+'</div>'+
      '<button class="li-del" data-act="del-income:'+r.id+'">✕</button></div>';
  });
  exps.forEach(function(e){
    var ci = catInfo(e.category);
    h += '<div class="list-item">'+
      '<div class="li-icon" style="background:var(--expense-soft)">'+ci.icon+'</div>'+
      '<div class="li-body" data-act="edit-expense:'+e.id+'" style="cursor:pointer"><div class="li-title">'+esc(expLabel(e))+'</div><div class="li-sub">'+(e.category==='fuel'&&e.liters?(fmtNum(e.liters,2)+' 公升 · '):'')+(e.kwh?(fmtNum(e.kwh,1)+' 度 · '):'')+(e.note?esc(e.note):'')+'</div></div>'+
      '<div class="li-amt expense num">-'+fmtMoney(e.amount)+'</div>'+
      '<button class="li-del" data-act="del-expense:'+e.id+'">✕</button></div>';
  });
  return h;
}

/* ---------- HISTORY TAB ---------- */
function renderHistory(){
  var y=uiMonth.getFullYear(), mo=uiMonth.getMonth();
  var first = new Date(y,mo,1);
  var startOffset = (first.getDay()+6)%7;
  var daysInMonth = new Date(y,mo+1,0).getDate();
  var t = todayStr();

  var netByDay = {};
  state.records.forEach(function(r){ if(monthKeyOf(r.date)===y+'-'+pad(mo+1)) netByDay[r.date]=(netByDay[r.date]||0)+computeNetRevenue(r)+(+r.tip||0); });
  state.expenses.forEach(function(e){ if(monthKeyOf(e.date)===y+'-'+pad(mo+1)) netByDay[e.date]=(netByDay[e.date]||0)-(+e.amount||0); });

  var h='';
  h += '<div class="month-nav"><button data-act="month:-1">‹</button><div class="m-title">'+y+' 年 '+(mo+1)+' 月</div><button data-act="month:1">›</button></div>';
  h += '<div class="card"><div class="cal-grid">';
  DOW.forEach(function(d){ h+='<div class="cal-dow">'+d+'</div>'; });
  for(var i=0;i<startOffset;i++) h += '<div class="cal-cell empty"></div>';
  for(var d=1; d<=daysInMonth; d++){
    var ds = y+'-'+pad(mo+1)+'-'+pad(d);
    var net = netByDay[ds];
    var cls = 'cal-cell';
    if(net>0) cls+=' pos'; else if(net<0) cls+=' neg';
    if(ds===t) cls+=' today';
    if(ds===selectedDay) cls+=' selected';
    if(TW_HOLIDAYS[ds]) cls+=' holiday';
    var said = (mo+1)+' 月 '+d+' 日'+(net ? ',結餘 '+(net<0?'負 ':'')+Math.abs(Math.round(net)).toLocaleString('zh-Hant-TW')+' 元' : '')+(TW_HOLIDAYS[ds]?',假日':'')+(ds===selectedDay?',已選取':'');

/* ---------- ANALYTICS TAB ---------- */
var chartTips = {};
function addDays(dateStr, n){ var d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return toDateStr(d); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function comparisonRanges(range){
  if(analyticsPeriod==='all') return null;
  var today = todayStr();
  if(range.from>today) return null;
  var partial = range.to>today;
  var cur = {from:range.from, to:partial?today:range.to};
  var len = daysBetween(cur.from, cur.to);
  var prev, label;
  if(analyticsPeriod==='day'){ prev={from:addDays(cur.from,-1),to:addDays(cur.to,-1)}; label='前一天'; }
  else if(analyticsPeriod==='week'){ prev={from:addDays(cur.from,-7),to:addDays(cur.to,-7)}; label=partial?'上週同期':'上週'; }
  else if(analyticsPeriod==='month'){
    var f=new Date(cur.from+'T00:00:00'); var pStart=new Date(f.getFullYear(),f.getMonth()-1,1);
    var pEnd=new Date(f.getFullYear(),f.getMonth(),0);
    var pTo=new Date(pStart); pTo.setDate(pStart.getDate()+len); if(pTo>pEnd) pTo=pEnd;
    prev={from:toDateStr(pStart),to:toDateStr(pTo)}; label=partial?'上月同期':'上月';
  }
  else if(analyticsPeriod==='year'){
    var lastYear = function(ds){ return (+ds.slice(0,4)-1)+ds.slice(4); };
    prev={from:lastYear(cur.from), to:lastYear(cur.to)}; label=partial?'去年同期':'去年';
  }
  else { prev={from:addDays(cur.from,-(len+1)),to:addDays(cur.from,-1)}; label='前一段同長度期間'; }
  return {cur:cur, prev:prev, label:label};
}
function periodMetrics(from,to){
  var recs = recordsInRange(from,to);
  var net = sumNetIncome(recs).total;
  var exp = sumExpense(expensesInRange(from,to))+fixedTotalForRange(from,to);
  var hours = totalHoursInRange(from,to);
  var km = totalKmInRange(from,to);
  return {
    net:net, profit:net-exp,
    trips:recs.filter(function(r){ return !platformDef(r.platform).tipOnly; }).length,
    hourly: hours>0?net/hours:null, perKm: km>0?net/km:null
  };
}
function shortRange(r){ var a=r.from.slice(5).replace('-','/'), b=r.to.slice(5).replace('-','/'); return a===b?a:(a+'–'+b); }
// a single day swings with weather and events, so it is measured against the last 7 days actually worked
function recentDaysAverage(day){
  var days = workingDayListInRange(addDays(day, -60), addDays(day, -1)).slice(-7);
  if(!days.length) return null;
  var net = 0, exp = 0, trips = 0, hours = 0, km = 0;
  days.forEach(function(d){
    var m = periodMetrics(d, d); net += m.net; exp += m.net - m.profit; trips += m.trips;
    hours += totalHoursInRange(d, d); km += totalKmInRange(d, d);
  });
  var n = days.length;
  return {days:days, m:{net:net/n, profit:(net-exp)/n, trips:Math.round(trips/n*10)/10, hourly:hours>0?net/hours:null, perKm:km>0?net/km:null}};
}
function comparisonHtml(range){
  var cr = comparisonRanges(range);
  if(!cr) return '';
  var a = periodMetrics(cr.cur.from, cr.cur.to), b;
  if(analyticsPeriod==='day'){
    var avg = recentDaysAverage(cr.cur.from);
    if(!avg) return '';
    b = avg.m; cr.label = '前 '+avg.days.length+' 個工作日平均'; cr.prev = {from:avg.days[0], to:avg.days[avg.days.length-1]};
  } else b = periodMetrics(cr.prev.from, cr.prev.to);
  function row(name, x, y, fmt){
    var delta = '—', color = 'var(--text-muted)';
    if(x!=null && y!=null && y!==0){
      var pct = (x-y)/Math.abs(y)*100;
      delta = (pct>=0?'▲ ':'▼ ')+Math.abs(pct).toFixed(1)+'%';
      color = pct>=0?'var(--income)':'var(--expense)';
    }
    return '<div class="list-item"><div class="li-body"><div class="li-title">'+name+'</div><div class="li-sub">'+cr.label+' '+(y!=null?fmt(y):'—')+'</div></div><div style="text-align:right"><div class="num" style="font-weight:700">'+(x!=null?fmt(x):'—')+'</div><div class="num" style="font-size:12px;color:'+color+'">'+delta+'</div></div></div>';
  }
  var h = '<div class="section"><div class="section-title">與'+cr.label+'比較('+shortRange(cr.cur)+' vs '+shortRange(cr.prev)+')</div><div class="card">';
  h += row('實收', a.net, b.net, fmtMoney);
  // fixed costs here are counted for the days in each range (so a month in progress compares fairly), unlike the
  // period card above, which counts the whole month
  h += row('淨利(固定成本按天攤)', a.profit, b.profit, fmtMoney);
  h += row('趟數', a.trips, b.trips, function(v){ return v+' 趟'; });
  h += row('實際時薪', a.hourly, b.hourly, fmtMoney2);
  h += row('每公里實收', a.perKm, b.perKm, fmtMoney2);
  h += '</div></div>';
  return h;
}
function platformEfficiencyHtml(recs){
  var map = {};
  recs.forEach(function(r){
    var def = platformDef(r.platform);
    if(def.tipOnly) return;
    if(!map[r.platform]) map[r.platform]={label:def.label,color:def.color,trips:0,net:0,gross:0};
    var m = map[r.platform];
    m.trips++; m.net += computeNetRevenue(r)+(+r.tip||0); m.gross += computeGrossRevenue(r);
  });
  var list = Object.keys(map).map(function(k){ var m=map[k]; m.avg=m.net/m.trips; m.feePct=m.gross>0?(m.gross-(m.net))/m.gross*100:0; return m; })
    .sort(function(a,b){ return b.avg-a.avg; });
  if(!list.length) return '';
  var max = list[0].avg||1;
  var h = '<div class="section"><div class="section-title">平台效率比較(平均每趟實收)</div><div class="card">';
  h += list.map(function(m){
    var w = Math.max(2, m.avg/max*100);
    return '<div style="padding:8px 0;border-bottom:1px solid var(--border)">'+
      '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><span style="font-size:13.5px;font-weight:700">'+esc(m.label)+'</span><span class="num" style="font-weight:700">'+fmtMoney2(m.avg)+' / 趟</span></div>'+
      '<div style="height:8px;margin:6px 0 4px;background:var(--surface-sunken);border-radius:4px"><div style="height:8px;width:'+w.toFixed(1)+'%;background:var(--accent);border-radius:4px"></div></div>'+
      '<div style="font-size:11.5px;color:var(--text-muted)">'+m.trips+' 趟 · 實收 '+fmtMoney(m.net)+' · 手續費佔車資 '+(m.feePct>0?m.feePct.toFixed(1)+'%':'0%')+'</div></div>';
  }).join('');
  h += '<div style="font-size:11px;color:var(--text-muted);padding-top:8px">平均每趟實收已扣手續費、含小費;小費箱不列入。</div></div></div>';
  return h;
}
function barChartHtml(id, items, emptyNote){
  var vals = items.map(function(it){ return it.value||0; });
  var max = Math.max.apply(null, vals.concat([0]));
  if(max<=0) return '<div class="card"><div style="font-size:12.5px;color:var(--text-muted);padding:6px 0">'+emptyNote+'</div></div>';
  chartTips[id] = items.map(function(it){ return it.tip; });
  var best=-1, worst=-1;
  items.forEach(function(it,i){
    if(!it.value) return;
    if(best<0 || it.value>items[best].value) best=i;
    if(worst<0 || it.value<items[worst].value) worst=i;
  });
  var h = '<div class="card"><div style="display:flex;align-items:flex-end;gap:2px;height:120px">';
  items.forEach(function(it,i){
    var pct = (it.value||0)/max*100;
    h += '<div data-act="bar-tip:'+id+':'+i+'" aria-label="'+esc(it.tip||'')+'" style="flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer">'+
      '<div style="height:'+pct.toFixed(1)+'%;'+(it.value>0?'min-height:2px;':'')+'background:'+(i===best?'var(--accent-strong)':'var(--accent)')+';border-radius:4px 4px 0 0"></div></div>';
  });
  h += '</div><div style="display:flex;gap:2px;margin-top:4px">';
  items.forEach(function(it){ h += '<div style="flex:1;min-width:0;text-align:center;font-size:9.5px;color:var(--text-muted);overflow:visible;white-space:nowrap;display:flex;justify-content:center">'+(it.axis||'')+'</div>'; });
  h += '</div><div id="tip-'+id+'" aria-live="polite" style="font-size:12px;color:var(--text);margin-top:8px;line-height:1.5;min-height:18px">'+
    (best>=0?('最好:'+items[best].tip+(worst>=0&&worst!==best?('<br>最差:'+items[worst].tip):'')):'')+
    '</div><div style="font-size:10.5px;color:var(--text-muted);margin-top:2px">點長條可看該項數字</div></div>';
  return h;
}
function patternsHtml(recs){
  chartTips = {};
  var dayNet = {};

  if(!days.length) return '';
  function avgBy(keyFn, keys){
    var sum={}, cnt={};
    days.forEach(function(d){ var k=keyFn(d); sum[k]=(sum[k]||0)+dayNet[d]; cnt[k]=(cnt[k]||0)+1; });
    return keys.map(function(k){ return {key:k, avg:cnt[k]?sum[k]/cnt[k]:0, n:cnt[k]||0}; });
  }
  var h = '<div class="section"><div class="section-title">生意規律分析</div>';

    if(businessDayOf(r.ts)!==r.date){ skipped++; return; }
    hourSum[d.getHours()] += computeNetRevenue(r)+(+r.tip||0); hourCnt[d.getHours()]++;
  });
  if(uiShow('timeslot')){
  h += '<div style="font-size:13px;font-weight:700;margin:4px 0 6px">時段(依記帳時間)</div>';
  h += barChartHtml('hour', hourSum.map(function(v,i){
    return {value:v, axis:(i%3===0?String(i):''), tip:pad(i)+':00–'+pad(i)+':59 · '+hourCnt[i]+' 趟 · 實收 '+fmtMoney(v)};
  }), '還沒有可分析的時段資料。');
  }
  if(skipped && uiShow('timeslot')) h += '<div style="font-size:10.5px;color:var(--text-muted);margin:4px 0 0">有 '+skipped+' 筆是事後補記的(記帳時間不是當天),不列入時段分析。</div>';

  var wd = ['一','二','三','四','五','六','日'];
  if(uiShow('weekday')){
  var byWd = avgBy(function(d){ return (new Date(d+'T00:00:00').getDay()+6)%7; }, [0,1,2,3,4,5,6]);
  h += '<div style="font-size:13px;font-weight:700;margin:14px 0 6px">星期(平均每個出車日實收)</div>';
  h += barChartHtml('weekday', byWd.map(function(x){
    return {value:x.avg, axis:wd[x.key], tip:'週'+wd[x.key]+' · 平均每天 '+fmtMoney(x.avg)+'(出車 '+x.n+' 天)'};
  }), '');
  }

  if(uiShow('dom')){
  var dom = []; for(var i=1;i<=31;i++) dom.push(i);
  var byDom = avgBy(function(d){ return +d.slice(8,10); }, dom);
  h += '<div style="font-size:13px;font-weight:700;margin:14px 0 6px">每月幾號(平均每個出車日實收)</div>';
  h += barChartHtml('dom', byDom.map(function(x){
    return {value:x.avg, axis:((x.key===1||x.key%5===0)?x.key:''), tip:x.key+' 號 · 平均每天 '+fmtMoney(x.avg)+'(出車 '+x.n+' 天)'};
  }), '');
  var thirds = avgBy(function(d){ var n=+d.slice(8,10); return n<=10?0:(n<=20?1:2); }, [0,1,2]);
  h += '<div class="summary-row" style="grid-template-columns:1fr 1fr 1fr;margin-top:8px">'+
    ['上旬(1–10)','中旬(11–20)','下旬(21–月底)'].map(function(n,i){
      return '<div class="stat-tile"><div class="lbl">'+n+'</div><div class="val num" style="font-size:15px">'+(thirds[i].n?fmtMoney(thirds[i].avg):'—')+'</div></div>';
    }).join('')+'</div>';
  }

  var months = {}; days.forEach(function(d){ months[d.slice(0,7)]=true; });

/* ---------- trip-based analytics: occupancy, empty gaps, ride length, pickup hotspots ---------- */
var EMPTY_GAP_CAP_MIN = 120; // gaps longer than this are treated as breaks, not waiting for a fare
function tripMin(p, d){ return (d.ts-p.ts)/60000; }
function straightKm(p, d){
  if(p.lat==null || p.lng==null || d.lat==null || d.lng==null) return null;
  var R = 6371, rad = Math.PI/180;
  var dLat = (d.lat-p.lat)*rad, dLng = (d.lng-p.lng)*rad;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(p.lat*rad)*Math.cos(d.lat*rad)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.sqrt(a));
}
function chartMode(id){ return ((state.chartPrefs||{})[id]) || 'bar'; }
function chartToggleHtml(id){
  var m = chartMode(id);
  return '<span class="chart-toggle"><button type="button" class="'+(m==='bar'?'on':'')+'" data-act="chart-mode:'+id+':bar">長條</button><button type="button" class="'+(m==='pie'?'on':'')+'" data-act="chart-mode:'+id+':pie">圓餅</button></span>';
}
// items: [{label, val, color, act?}]; the pie keeps the 5 biggest and folds the rest into 其餘
function shareChartHtml(id, items, fmt){
  var tot = 0; items.forEach(function(it){ tot += it.val; }); if(!tot) return '';
  function pct(v){ return Math.round(v/tot*100); }
  function row(it){
    return '<div class="legend-row"'+(it.act?' data-act="'+it.act+'" style="cursor:pointer"':'')+'><span class="legend-dot" style="background:'+it.color+'"></span><span class="lname">'+esc(it.label)+(it.act?' ›':'')+'</span><span class="lval num">'+fmt(it.val)+' · '+pct(it.val)+'%</span></div>';
  }
  if(chartMode(id)==='pie'){
    var shown = items;
    if(items.length>6){
      var rest = 0; items.slice(5).forEach(function(it){ rest += it.val; });
      shown = items.slice(0,5).concat([{label:'其餘 '+(items.length-5)+' 項', val:rest, color:'#8A8272'}]);
    }
    var acc = 0, stops = shown.map(function(it){ var a = acc/tot*360; acc += it.val; return it.color+' '+a.toFixed(2)+'deg '+(acc/tot*360).toFixed(2)+'deg'; }).join(',');
    return '<div class="pie-wrap"><div class="pie" style="background:conic-gradient('+stops+')"></div><div class="donut-legend" style="flex:1;min-width:0">'+shown.map(row).join('')+'</div></div>';
  }
  return '<div class="donut-legend" style="gap:0">'+items.map(function(it){
    return row(it)+'<div class="share-track"><div style="width:'+(it.val/tot*100).toFixed(1)+'%;background:'+it.color+'"></div></div>';
  }).join('')+'</div>';
}
function shareBarHtml(title, counts, labels, colors, id){
  var tot = counts.reduce(function(a,b){ return a+b; },0); if(!tot) return '';
  var h = '<div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;margin:14px 0 6px">'+title+(id?chartToggleHtml(id):'')+'</div>';
  if(id && chartMode(id)==='pie'){
    return h + shareChartHtml(id, counts.map(function(c,i){ return {label:labels[i], val:c, color:colors[i]}; }).filter(function(it){ return it.val; }), function(v){ return v+' 趟'; });

  h += '<div style="display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--text-muted);margin-top:6px">'+counts.map(function(c,i){ return '<span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+colors[i]+';margin-right:4px"></span>'+labels[i]+' '+Math.round(c/tot*100)+'%('+c+')</span>'; }).join('')+'</div>';

function timedTripsByDay(from, to){
  var days = {};
  function add(o){
    if(!o.pickup || !o.dropoff || !o.pickup.ts || !o.dropoff.ts) return;
    var d = businessDayOf(o.pickup.ts); if(!inRange(d,from,to)) return;
    (days[d] = days[d] || []).push(o);
  }
  state.records.forEach(function(r){ if(r.tripId) add({rec:r, pickup:r.pickup, dropoff:r.dropoff, accept:r.accept}); });
  (state.pendingTrips||[]).forEach(function(t){ add({rec:null, pickup:t.pickup, dropoff:t.dropoff, accept:t.accept}); });
  Object.keys(days).forEach(function(d){ days[d].sort(function(a,b){ return a.pickup.ts-b.pickup.ts; }); });
  return days;
}
function tripInsightsHtml(range){
  var days = timedTripsByDay(range.from, range.to);
  var dayKeys = Object.keys(days).sort();
  if(!dayKeys.length){
    return uiShow('tripEff') ? '<div class="section"><div class="section-title">🚕 載客效率(上下車紀錄)</div><div class="card"><div style="font-size:12.5px;color:var(--text-muted);line-height:1.6">這段期間還沒有上下車紀錄。載客時按記帳頁的「上車」「下車」,這裡就會算出載客率、空車時間、搭車長短和上車熱區。</div></div></div>' : '';
  }
  var n=0, occMin=0, gaps=[], plat={}, buckets=[0,0,0], kmBuckets=[0,0,0], kmSum=0, kmN=0;
  var accN=0, waitN=0, waitSum=0, approachSum=0, apKmSum=0, apKmN=0, accPlat={};
  var fullOcc=0, fullWork=0, fullDays=0;
  dayKeys.forEach(function(d){
    var list = days[d], dayOcc = 0;
    list.forEach(function(o,i){
      var m = tripMin(o.pickup,o.dropoff); if(m<0) return;
      n++; occMin += m; dayOcc += m;
      var rm = Math.round(m); buckets[rm<=15?0:(rm<=34?1:2)]++;
      var km = straightKm(o.pickup, o.dropoff);
      if(km!=null){ kmBuckets[km<3?0:(km<12?1:2)]++; kmSum += km; kmN++; }
      if(o.accept && o.accept.ts<=o.pickup.ts){
        var ap = (o.pickup.ts - o.accept.ts)/60000;
        var wt = i>0 ? (o.accept.ts - list[i-1].dropoff.ts)/60000 : null;
        if(ap<=EMPTY_GAP_CAP_MIN && (wt==null || (wt>=0 && wt<=EMPTY_GAP_CAP_MIN))){
          accN++; approachSum += ap;
          var akm = straightKm(o.accept, o.pickup); if(akm!=null){ apKmSum += akm; apKmN++; }
          var ak = o.rec ? o.rec.platform : null;
          if(ak){ var apl = accPlat[ak] || (accPlat[ak] = {label:platformDef(ak).label, ap:0, apN:0, wt:0, wtN:0}); apl.ap += ap; apl.apN++; if(wt!=null){ apl.wt += wt; apl.wtN++; } }
          if(wt!=null){ waitSum += wt; waitN++; }
        }
      }
      if(i>0){
        var g = (o.pickup.ts - list[i-1].dropoff.ts)/60000;
        if(g>=0 && g<=EMPTY_GAP_CAP_MIN){
          gaps.push(g);
          if(o.rec){
            var k = o.rec.platform;

            plat[k].sum += g; plat[k].cnt++;

        }

    });
    // occupancy only on days where every fare was recorded with 上車/下車, otherwise it reads too low
    var dayRecs = state.records.filter(function(r){ return r.date===d && !platformDef(r.platform).tipOnly; });
    var allTimed = dayRecs.length>0 && dayRecs.every(function(r){ return r.tripId && r.pickup && r.dropoff; });
    var wh = totalHoursInRange(d,d);
    if(allTimed && wh>0){ fullOcc += dayOcc; fullWork += wh*60; fullDays++; }
  });
  var avgGap = gaps.length ? gaps.reduce(function(a,b){return a+b;},0)/gaps.length : null;
  var h = '<div class="section"><div class="section-title">🚕 載客效率(上下車紀錄)</div><div class="card">';
  h += '<div class="summary-row" style="grid-template-columns:1fr 1fr">';
  h += '<div class="stat-tile"><div class="lbl">載客率</div><div class="val num">'+(fullWork>0?fmtNum(fullOcc/fullWork*100,1)+'%':'—')+'</div></div>';
  h += '<div class="stat-tile"><div class="lbl">平均空檔時間</div><div class="val num">'+(avgGap!=null?fmtNum(avgGap,1)+' 分':'—')+'</div></div>';
  h += '<div class="stat-tile"><div class="lbl">平均每趟載客</div><div class="val num">'+fmtNum(occMin/n,1)+' 分</div></div>';
  h += '<div class="stat-tile"><div class="lbl">有紀錄的趟數</div><div class="val num">'+n+' 趟</div></div>';

function shareOrDownloadFile(filename, text, mime){
  // the app cannot download into the phone like a browser; it writes the file and opens the share sheet
  var capShare = NATIVE_FS && window.Capacitor.Plugins.Share;
  if(capShare){
    return NATIVE_FS.writeFile({path:filename, directory:'CACHE', encoding:'utf8', data:text}).then(function(w){
      return capShare.share({title:filename, files:[w.uri], dialogTitle:/備份/.test(filename) ? '把備份檔存到雲端硬碟(只傳 LINE,聊天室的檔案會過期)' : '把檔案存到…(雲端硬碟、檔案、LINE 都可以)'});
    }).then(function(){ return true; }, function(err){
      var why = String(err && (err.message||err));
      if(/cancel/i.test(why)) return false;
      var full = /no space|ENOSPC/i.test(why);
      var head = (full ? '手機空間不夠,存不出檔案。' : '沒辦法存出檔案。')+'\n\n請先不要關掉記帳本。'+
        (full ? '可以到手機設定清出一些空間(例如刪掉用不到的影片、App),再試一次。' : '可以再試一次。');
      // copying the ledger as text needs no free space, so a backup can still be taken
      if(/備份/.test(filename)){
        if(confirm(head+'\n\n或者現在改用「複製文字」:把整本帳複製起來,貼到 LINE 傳給自己或備忘錄(資料多時可能貼不下)。\n\n要改用複製文字嗎?')) openExportModal();
      } else alert(head);
      return false;
    });
  }
  var blob = new Blob([text], {type:mime});
  var file = null;
  try{ file = new File([blob], filename, {type:mime}); }catch(e){}
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    return navigator.share({files:[file], title:filename}).then(function(){ return true; }, function(err){
      if(err && err.name==='AbortError') return false;
      downloadBlob(filename, blob);
      return true;
    });
  }
  downloadBlob(filename, blob);
  return Promise.resolve(true);
}
