<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>跑車人生</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#F3F0E8;
  --surface:#FFFFFF;
  --surface-sunken:#E7E1D2;
  --text:#231F18;
  --text-muted:#7A735F;
  --border:#DED6C2;
  --accent:#C97E17;
  --accent-strong:#9C6110;
  --accent-soft:#F2DFB6;
  --income:#1E7A4C;
  --income-soft:#DCEFE2;
  --expense:#B8402C;
  --expense-soft:#F8E1DA;
  --shadow: 0 1px 2px rgba(35,31,24,.06), 0 4px 14px rgba(35,31,24,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15130F;
    --surface:#1E1B15;
    --surface-sunken:#0F0D0A;
    --text:#F1ECDF;
    --text-muted:#A79C82;
    --border:#332C20;
    --accent:#E5A33D;
    --accent-strong:#F0B655;
    --accent-soft:#3A2C14;
    --income:#4FC98A;
    --income-soft:#193024;
    --expense:#E5715A;
    --expense-soft:#3A1D16;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#15130F;
  --surface:#1E1B15;
  --surface-sunken:#0F0D0A;
  --text:#F1ECDF;
  --text-muted:#A79C82;
  --border:#332C20;
  --accent:#E5A33D;
  --accent-strong:#F0B655;
  --accent-soft:#3A2C14;
  --income:#4FC98A;
  --income-soft:#193024;
  --expense:#E5715A;
  --expense-soft:#3A1D16;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Noto Sans TC', system-ui, sans-serif;
  font-variant-numeric:tabular-nums;
  padding-top:env(safe-area-inset-top,0px);
}
.num{font-family:'Space Grotesk','Noto Sans TC',system-ui,sans-serif;}
.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;position:relative}
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--bg);
  padding:14px 16px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:baseline;gap:8px}
.brand-name{font-weight:900;font-size:19px;letter-spacing:.2px}
.topbar-right{display:flex;align-items:center;gap:10px}
.today-net{font-family:'Space Grotesk';font-weight:700;font-size:15px}
.today-net.pos{color:var(--income)}
.today-net.neg{color:var(--expense)}
.icon-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface);display:flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer;color:var(--text);
}
.content{flex:1;overflow-y:auto;padding:14px 16px 24px;-webkit-overflow-scrolling:touch}
.bottom-nav{
  position:sticky;bottom:0;z-index:20;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--surface);border-top:1px solid var(--border);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
}
.nav-btn{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;color:var(--text-muted);font-size:11px;
  padding:6px 2px;border-radius:10px;cursor:pointer;font-family:inherit;
}
.nav-btn .ic{font-size:19px}
.nav-btn.active{color:var(--accent-strong)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.section{margin-bottom:16px}
.section-title{font-size:13px;font-weight:700;color:var(--text-muted);margin:0 0 8px 2px;display:flex;align-items:center;justify-content:space-between}

.summary-row{display:grid;gap:8px}
.stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 12px}
.stat-tile .lbl{font-size:10.5px;color:var(--text-muted);margin-bottom:4px}
.stat-tile .val{font-family:'Space Grotesk';font-weight:700;font-size:16px}
.stat-tile .val.income{color:var(--income)}
.stat-tile .val.expense{color:var(--expense)}

.platform-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.platform-chip{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:12px 6px;text-align:center;cursor:pointer;min-height:62px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
}
.platform-chip:active{background:var(--accent-soft)}
.plat-badge{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:1px;flex:none}
.platform-chip .pname{font-size:12px;font-weight:700;line-height:1.25}
.platform-chip .ptotal{font-size:10.5px;color:var(--text-muted);font-family:'Space Grotesk'}
.platform-chip .ptotal.has{color:var(--income)}

.expense-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.expense-chip{
  background:var(--expense-soft);border:1px solid var(--border);border-radius:14px;
  padding:10px 8px;text-align:center;cursor:pointer;min-height:56px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
}
.expense-chip .eic{font-size:17px}
.expense-chip .ename{font-size:12px;font-weight:700;color:var(--expense)}

.daily-card{display:flex;flex-direction:column;gap:10px}
.daily-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.daily-row .l{font-size:13px;font-weight:700;color:var(--text-muted)}
.km-input{
  width:100px;text-align:right;font-family:'Space Grotesk';font-weight:700;font-size:15px;
  background:var(--surface-sunken);border:1px solid var(--border);border-radius:10px;padding:7px 9px;color:var(--text)
}
.shift-btn{
  border:none;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;
}
.shift-btn.start{background:var(--income-soft);color:var(--income)}
.shift-btn.stop{background:var(--expense-soft);color:var(--expense)}
.hours-badge{font-family:'Space Grotesk';font-weight:700;font-size:13px}

.list-item{
  display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);
}
.list-item:last-child{border-bottom:none}
.li-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.li-body{flex:1;min-width:0}
.li-title{font-size:13.5px;font-weight:700}
.li-sub{font-size:11px;color:var(--text-muted)}
.li-amt{font-family:'Space Grotesk';font-weight:700;font-size:14.5px;white-space:nowrap}
.li-amt.income{color:var(--income)}
.li-amt.expense{color:var(--expense)}
.li-del{background:none;border:none;color:var(--text-muted);font-size:16px;cursor:pointer;padding:4px 2px}

.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.month-nav .m-title{font-weight:700;font-size:15px}
.month-nav button{background:var(--surface);border:1px solid var(--border);width:32px;height:32px;border-radius:9px;font-size:15px;cursor:pointer;color:var(--text)}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px}
.cal-dow{text-align:center;font-size:10.5px;color:var(--text-muted);font-weight:700;padding-bottom:2px}
.cal-cell{
  aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--surface-sunken);cursor:pointer;font-size:10.5px;gap:1px;border:2px solid transparent;
}
.cal-cell.empty{visibility:hidden;cursor:default}
.cal-cell .d{font-family:'Space Grotesk';font-weight:700;font-size:12px}
.cal-cell .n{font-size:9px;font-family:'Space Grotesk';font-weight:700}
.cal-cell.pos{background:var(--income-soft)}
.cal-cell.pos .n{color:var(--income)}
.cal-cell.neg{background:var(--expense-soft)}
.cal-cell.neg .n{color:var(--expense)}
.cal-cell.holiday .d{color:var(--expense)}
.cal-cell.today{border-color:var(--accent)}
.cal-cell.selected{outline:2px solid var(--accent-strong);outline-offset:1px}

.segmented{display:flex;background:var(--surface-sunken);border-radius:12px;padding:3px;gap:3px;overflow-x:auto}
.segmented button{
  flex:1;border:none;background:none;padding:8px 6px;border-radius:9px;font-size:12px;font-weight:700;
  color:var(--text-muted);cursor:pointer;font-family:inherit;white-space:nowrap;
}
.segmented button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

.progress-wrap{margin-top:6px}
.progress-lbl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.progress-lbl .p{color:var(--text-muted)}
.progress-lbl .v{font-family:'Space Grotesk';font-weight:700}
.progress-bar{height:8px;background:var(--surface-sunken);border-radius:5px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:5px}

.empty-state{text-align:center;padding:36px 14px;color:var(--text-muted)}
.empty-state .ic{font-size:30px;margin-bottom:8px}
.empty-state .t{font-size:13px}

.btn-row{display:flex;gap:8px}
.btn{flex:1;border:none;border-radius:12px;padding:11px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:var(--surface-sunken);color:var(--text)}
.btn-danger{background:var(--expense-soft);color:var(--expense)}
.add-fixed-btn{
  width:100%;border:1.5px dashed var(--border);background:none;border-radius:14px;padding:12px;
  color:var(--text-muted);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;
}

.modal-overlay{
  position:fixed;inset:0;background:rgba(20,17,12,.5);z-index:50;
  display:flex;align-items:flex-end;justify-content:center;
}
.modal{
  background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;
  padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;
  box-shadow:0 -4px 24px rgba(0,0,0,.2);
}
.modal-title{font-size:16px;font-weight:900;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.modal-title .close{background:var(--surface-sunken);border:none;width:30px;height:30px;border-radius:9px;font-size:15px;cursor:pointer;color:var(--text)}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:6px}
.form-row input, .form-row select{
  width:100%;background:var(--surface-sunken);border:1px solid var(--border);border-radius:11px;
  padding:11px 12px;font-size:15px;color:var(--text);font-family:inherit;
}
.form-row input.num-input{font-family:'Space Grotesk';font-weight:700}
.form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid2 label{display:block;margin-bottom:6px}

.chip-row{display:flex;flex-wrap:wrap;gap:7px}
.chip-opt{
  border:1px solid var(--border);background:var(--surface-sunken);color:var(--text-muted);
  border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;
}
.chip-opt.selected{background:var(--accent);border-color:var(--accent);color:#fff}

.plat-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}
.plat-row:last-child{border-bottom:none}
.plat-row.dragging{opacity:.4}
.plat-drag-handle{cursor:grab;touch-action:none;color:var(--text-muted);font-size:16px;padding:4px 6px;flex:none;user-select:none}

.tag-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.tag{
  background:var(--surface-sunken);border:1px solid var(--border);border-radius:10px;
  padding:7px 10px;font-size:13px;display:flex;align-items:center;gap:7px;
}
.tag button{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:13px}

.donut-legend{display:flex;flex-direction:column;gap:7px;margin-top:2px}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px}
.legend-dot{width:9px;height:9px;border-radius:50%;flex:none}
.legend-row .lname{flex:1;color:var(--text-muted)}
.legend-row .lval{font-family:'Space Grotesk';font-weight:700}
</style>

</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <button class="brand-name" data-act="rename-app" style="background:none;border:none;padding:0;font:inherit;font-weight:900;font-size:19px;letter-spacing:.2px;cursor:pointer;color:inherit;display:flex;align-items:center;gap:6px">🚕 <span id="appNameLabel">跑車人生</span></button>
    </div>
    <div class="topbar-right">
      <span id="todayNet" class="today-net"></span>
      <button class="icon-btn" data-act="open-settings" title="設定">⚙️</button>
    </div>
  </div>
  <main id="content" class="content"></main>
  <nav class="bottom-nav">
    <button class="nav-btn" data-act="tab:entry"><span class="ic">✏️</span>記帳</button>
    <button class="nav-btn" data-act="tab:history"><span class="ic">📅</span>歷史</button>
    <button class="nav-btn" data-act="tab:expense"><span class="ic">🧾</span>支出</button>
    <button class="nav-btn" data-act="tab:analytics"><span class="ic">📊</span>分析</button>
  </nav>
</div>
<div id="modalRoot"></div>

<script>
(function(){
'use strict';

var STORAGE_KEY = 'taxi_ledger_v2';
var CATS = [
  {key:'fuel',label:'加油',icon:'⛽'},
  {key:'parking',label:'停車費',icon:'🅿️'},
  {key:'toll',label:'E-Tag',icon:'🛣️'},
  {key:'wash',label:'洗車打蠟',icon:'🧽'},
  {key:'ticket',label:'罰單',icon:'🚫'},
  {key:'other',label:'其他',icon:'📝'}
];
var DOW = ['一','二','三','四','五','六','日'];

/* ---------- Taiwan 2026 official public holidays (行政院人事行政總處) ---------- */
var TW_HOLIDAY_BLOCKS_2026 = [
  {name:'元旦', from:'2026-01-01', to:'2026-01-01'},
  {name:'農曆春節', from:'2026-02-14', to:'2026-02-22'},
  {name:'和平紀念日', from:'2026-02-27', to:'2026-03-01'},
  {name:'兒童節及清明節', from:'2026-04-03', to:'2026-04-06'},
  {name:'勞動節', from:'2026-05-01', to:'2026-05-03'},
  {name:'端午節', from:'2026-06-19', to:'2026-06-21'},
  {name:'中秋節及教師節', from:'2026-09-25', to:'2026-09-28'},
  {name:'國慶日', from:'2026-10-09', to:'2026-10-11'},
  {name:'台灣光復節', from:'2026-10-24', to:'2026-10-26'},
  {name:'行憲紀念日', from:'2026-12-25', to:'2026-12-27'}
];
var TW_HOLIDAY_BLOCKS_2027 = [
  {name:'開國紀念日', from:'2027-01-01', to:'2027-01-03'},
  {name:'農曆春節', from:'2027-02-04', to:'2027-02-10'},
  {name:'和平紀念日', from:'2027-02-27', to:'2027-03-01'},
  {name:'兒童節及清明節', from:'2027-04-03', to:'2027-04-06'},
  {name:'勞動節', from:'2027-04-30', to:'2027-05-02'},
  {name:'端午節', from:'2027-06-09', to:'2027-06-09'},
  {name:'中秋節', from:'2027-09-15', to:'2027-09-15'},
  {name:'教師節', from:'2027-09-28', to:'2027-09-28'},
  {name:'國慶日', from:'2027-10-09', to:'2027-10-11'},
  {name:'台灣光復節', from:'2027-10-23', to:'2027-10-25'},
  {name:'行憲紀念日', from:'2027-12-24', to:'2027-12-26'},
  {name:'開國紀念日補假(跨年)', from:'2027-12-31', to:'2027-12-31'}
];
var TW_HOLIDAY_BLOCKS_ALL = TW_HOLIDAY_BLOCKS_2026.concat(TW_HOLIDAY_BLOCKS_2027);
var TW_HOLIDAYS = {};
TW_HOLIDAY_BLOCKS_ALL.forEach(function(b){
  var d = new Date(b.from+'T00:00:00'); var end = new Date(b.to+'T00:00:00');
  while(d<=end){
    var ds = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    TW_HOLIDAYS[ds] = b.name;
    d.setDate(d.getDate()+1);
  }
});
function holidayBlocksInMonth(y, mo){
  return TW_HOLIDAY_BLOCKS_ALL.filter(function(b){
    var by = +b.from.slice(0,4), bm = +b.from.slice(5,7)-1;
    var ey = +b.to.slice(0,4), em = +b.to.slice(5,7)-1;
    var monthNum = y*12+mo;
    return monthNum >= (by*12+bm) && monthNum <= (ey*12+em);
  });
}
function holidayBlockDays(b){
  return Math.round((new Date(b.to+'T00:00:00') - new Date(b.from+'T00:00:00'))/86400000)+1;
}

/* ---------- platform definitions ---------- */
var PLATFORM_DEFS = [
  {key:'uber', label:'Uber', icon:'🚙', color:'#000000', subtypeOptions:['菁英X','樂聚XL','毛孩優步','舒適優步','尊榮優步','純電優步','加大樂聚XXL'], hasMarkupAmount:true},
  {key:'tdc', label:'台灣大車隊', icon:'🚕', color:'#1E5FA8', fareTypeOptions:['跳表','預估車資'], paymentOptions:['現金','企業簽單','信用卡','好孕卷'], estimateHasMarkupAmount:true, estimateHasMarkupMultiplier:true},
  {key:'metro', label:'大都會', icon:'🚗', color:'#FFFFFF', fareTypeOptions:['跳表','預估車資'], discountOptions:['原價','婦派','海派','鑽派','超派'], paymentOptions:['現金','企業簽單','信用卡','好孕卷'], estimateHasMarkupAmount:true, estimateHasMarkupMultiplier:true},
  {key:'bolt', label:'BOLT', icon:'⚡', color:'#1B5E20', subtypeOptions:['經典博特','舒適博特','揪團博特','寵物博特','尊榮博特'], hasMarkupMultiplier:true},
  {key:'yoxi', label:'YOXI', icon:'🚐', color:'#90CAF9', fareTypeOptions:['跳表','預估車資','據點叫車'], paymentOptions:['現金','企業簽單','信用卡'], enterpriseDiscountOptions:['原價','95折','92折','85折'], estimateTypeOptions:['一般多元','樂聚多元','減碳多元'], estimateHasMarkupMultiplier:true, hasStationFee:true},
  {key:'linego', label:'Line Go', icon:'💬', color:'#06C755', subtypeOptions:['一般','六人座'], hasMarkupMultiplier:true},
  {key:'private', label:'私客', icon:'🙋🏻', color:'#7A5FBF'},
  {key:'hailyellow', label:'呼叫小黃', icon:'🚖', color:'#F5C518'  , fareTypeOptions:['跳表','固定價']},
  {key:'street', label:'路招', icon:'👋🏻', color:'#F5A85C'},
  {key:'reservation', label:'預約單', icon:'📅', color:'#B08D57', subPlatformOptions:['Uber','台灣大車隊','大都會','BOLT','YOXI','Line Go','呼叫小黃']},
  {key:'phonecall', label:'接電', icon:'🔋', color:'#E53935', subtypeOptions:['台灣大車隊','大都會','路招客']},
  {key:'tipbox', label:'小費/小費箱', icon:'💰', color:'#2FA0A0', tipOnly:true}
];
function mergePlatformOverride(p, ov){
  var out = {};
  for(var k in p){ out[k]=p[k]; }
  if(ov && ov.label) out.label = ov.label;
  if(ov && ov.icon) out.icon = ov.icon;
  if(ov && ov.color) out.color = ov.color;
  out.hidden = !!(ov && ov.hidden);
  return out;
}
function orderedPlatforms(list){
  var order = state.platformOrder||[];
  return list.slice().sort(function(a,b){
    var ia = order.indexOf(a.key); if(ia<0) ia=9999;
    var ib = order.indexOf(b.key); if(ib<0) ib=9999;
    return ia-ib;
  });
}
function allPlatforms(){
  var list = PLATFORM_DEFS.map(function(p){
    return mergePlatformOverride(p, state.platformOverrides[p.key]);
  });
  (state.customPlatforms||[]).forEach(function(c){
    var cp = {key:c.key, label:c.label, hidden:!!c.hidden, custom:true, icon:c.icon||'🚘', color:c.color||'#8A8272'};

/* ---------- fee / net revenue ---------- */
function boltWeekTripCount(dateStr){
  var d = new Date(dateStr+'T00:00:00');
  var day = (d.getDay()+6)%7;
  var mon = new Date(d); mon.setDate(d.getDate()-day);
  var sun = new Date(mon); sun.setDate(mon.getDate()+6);
  var from = toDateStr(mon), to = toDateStr(sun);
  var count = 0;
  state.records.forEach(function(r){ if(r.platform==='bolt' && r.date>=from && r.date<=to) count++; });
  return count;
}
function computeNetRevenue(r){
  var gross = +r.revenue||0;
  if(gross<=0) return 0;
  var fees = state.feeRules||{};
  if(r.platform==='uber'){
    return gross;
  }
  if(r.platform==='bolt'){
    var flatB = fees.boltFlat!=null?fees.boltFlat:20;
    var thresholdEnabled = fees.boltThresholdEnabled!==false;
    if(thresholdEnabled){
      var threshold = fees.boltThreshold!=null?fees.boltThreshold:15;
      var weekCount = boltWeekTripCount(r.date);
      if(weekCount>=threshold){
        var pctB = fees.boltPct!=null?fees.boltPct:10;
        return gross*(1-pctB/100);
      }
    }
    return gross*(1-flatB/100);
  }
  if(r.platform==='tdc'){
    var pct = fees.tdc!=null?fees.tdc:15;
    return gross*(1-pct/100);
  }
  if(r.platform==='yoxi'){
    var yoxiBase = fees.yoxiCash!=null?fees.yoxiCash:10;
    var yoxiCreditExtra = fees.yoxiCreditExtra!=null?fees.yoxiCreditExtra:2;
    if(r.fareType==='據點叫車'){
      var netStation = gross*(1-yoxiBase/100) - (+r.stationFee||0);
      return netStation>0?netStation:0;
    }
    if(r.fareType==='跳表'){
      if(r.payment==='企業簽單'){
        var discMap = {'原價':1,'95折':0.95,'92折':0.92,'85折':0.85};
        var mult = discMap[r.enterpriseDiscount]!=null ? discMap[r.enterpriseDiscount] : 1;
        return gross*mult*(1-yoxiBase/100);
      }
      if(r.payment==='信用卡'){
        return gross*(1-(yoxiBase+yoxiCreditExtra)/100);
      }
      return gross*(1-yoxiBase/100);
    }
    return gross*(1-yoxiBase/100);
  }
  if(r.platform==='linego'){
    var pct3 = fees.linego!=null?fees.linego:19.5;
    return gross*(1-pct3/100);
  }
  if(r.platform==='metro'){
    var discounted = gross;
    var tier = r.discountTier||'原價';
    if(gross>=100){
      if(tier==='婦派') discounted = gross*0.9;
      else if(tier==='海派') discounted = gross*0.85;
      else if(tier==='鑽派') discounted = gross*0.8;
      else if(tier==='超派') discounted = gross - Math.min(gross*0.3,300);
    }
    var afterSurcharge = discounted;
    if(r.payment==='信用卡') afterSurcharge = discounted*(1-(fees.metroCredit!=null?fees.metroCredit:3)/100);
    else if(r.payment==='企業簽單') afterSurcharge = discounted*(1-(fees.metroEnterprise!=null?fees.metroEnterprise:6)/100);
    var flat = fees.metroFlat!=null?fees.metroFlat:25;
    var net = afterSurcharge-flat;
    return net>0?net:0;
  }
  return gross;
}
function computeGrossRevenue(r){
  var v = +r.revenue||0;
  if(v<=0) return 0;
  var fees = state.feeRules||{};
  if(r.platform==='uber'){
    var pctU = fees.uber!=null?fees.uber:25;
    return v/(1-pctU/100);
  }
  return v;
}
function describeRecord(r){
  var parts=[];
  if(r.subtype) parts.push(r.subtype);
  if(r.subPlatform) parts.push('→'+r.subPlatform);
  if(r.fareType) parts.push(r.fareType);
  if(r.discountTier && r.discountTier!=='原價') parts.push(r.discountTier);
  if(r.payment) parts.push(r.payment);
  if(r.enterpriseDiscount && r.enterpriseDiscount!=='原價') parts.push(r.enterpriseDiscount);
  if(r.estimateType) parts.push(r.estimateType);
  if(r.stationFee) parts.push('據點費$'+r.stationFee);
  if(r.markupMultiplier) parts.push('加成'+r.markupMultiplier+'倍');
  if(r.markupAmount) parts.push('加成$'+r.markupAmount);
  return parts.join(' · ');
}

/* ---------- Google Sheet sync (fire-and-forget) ---------- */
function syncToSheet(kind, payload){
  if(!state.syncUrl) return;
  payload = payload || {};
  payload.kind = kind;
  try{
    fetch(state.syncUrl, {
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
function syncIncomeRecord(r){
  syncToSheet('income', {
    id:r.id, date:r.date, ts:r.ts, platform:r.platform, platformLabel:platformDef(r.platform).label,
    revenue:computeGrossRevenue(r), tip:r.tip, net:computeNetRevenue(r),
    subtype:r.subtype, fareType:r.fareType, payment:r.payment, discountTier:r.discountTier,
    estimateType:r.estimateType, markupAmount:r.markupAmount, markupMultiplier:r.markupMultiplier,
    subPlatform:r.subPlatform, note:r.note
  });
}
function syncExpenseRecord(e){
  syncToSheet('expense', {
    id:e.id, date:e.date, ts:e.ts, category:e.category, categoryLabel:catInfo(e.category).label,
    amount:e.amount, liters:e.liters, note:e.note
  });
}
function syncDailyRecord(dateStr){
  var m = dm(dateStr);
  syncToSheet('daily', {
    date:dateStr, km:m.km,
    hours: +((m.workedMs||0)/3600000).toFixed(2),
    breakHours: +((m.breakMs||0)/3600000).toFixed(2)
  });
}
function syncFixedCost(fc, ym){
  ym = ym || (function(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1); })();
  syncToSheet('fixedcost', {
    month: ym, name: fc.name, freq: fc.freq, baseAmount: fc.amount,
    appliedAmount: fixedCostForMonth(fc, ym)
  });
}
function syncAllData(onProgress, onDone){
  var queue = [];
  state.records.forEach(function(r){ queue.push(function(){ syncIncomeRecord(r); }); });
  state.expenses.forEach(function(e){ queue.push(function(){ syncExpenseRecord(e); }); });
  Object.keys(state.dailyMeta).forEach(function(d){ queue.push(function(){ syncDailyRecord(d); }); });
  var curYm = (function(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1); })();
  state.fixedCosts.forEach(function(fc){ queue.push(function(){ syncFixedCost(fc, curYm); }); });
  var i = 0;
  function step(){
    if(i>=queue.length){ if(onDone) onDone(i); return; }
    queue[i](); i++;
    if(onProgress) onProgress(i, queue.length);
    setTimeout(step, 180);
  }
  step();
}

/* ---------- computations ---------- */
function inRange(dateStr, from, to){ return dateStr>=from && dateStr<=to; }
function recordsInRange(from,to){ return state.records.filter(function(r){return inRange(r.date,from,to);}); }
function expensesInRange(from,to){ return state.expenses.filter(function(e){return inRange(e.date,from,to);}); }

function sumIncome(recs){
  var rev=0, tip=0;
  recs.forEach(function(r){ rev+=computeGrossRevenue(r); tip+=(+r.tip||0); });
  return {rev:rev, tip:tip, total:rev+tip};
}
function sumNetIncome(recs){
  var net=0, tip=0;
  recs.forEach(function(r){ net+=computeNetRevenue(r); tip+=(+r.tip||0); });
  return {net:net, tip:tip, total:net+tip};
}
function sumExpense(exps){
  var t=0; exps.forEach(function(e){ t+=(+e.amount||0); }); return t;
}
function monthsBetween(from,to){
  var months=[]; var a=new Date(from+'T00:00:00'); var b=new Date(to+'T00:00:00');
  var cur=new Date(a.getFullYear(),a.getMonth(),1);
  var end=new Date(b.getFullYear(),b.getMonth(),1);
  while(cur<=end){ months.push(cur.getFullYear()+'-'+pad(cur.getMonth()+1)); cur.setMonth(cur.getMonth()+1); }
  return months;
}
function fixedCostForMonth(fc, ym){
  var ov = state.fixedOverrides[ym] && state.fixedOverrides[ym][fc.id];
  if(ov!=null) return +ov;
  return fc.freq==='yearly' ? (+fc.amount||0)/12 : (+fc.amount||0);
}
function fixedTotalForRange(from,to){
  var months = monthsBetween(from,to);
  var total=0;
  var fromD = new Date(from+'T00:00:00');
  var toD = new Date(to+'T00:00:00');
  months.forEach(function(ym){
    var y = +ym.slice(0,4), m = +ym.slice(5,7)-1;
    var mDays = new Date(y,m+1,0).getDate();
    var monthStart = new Date(y,m,1);
    var monthEnd = new Date(y,m,mDays);
    var rangeStart = fromD > monthStart ? fromD : monthStart;
    var rangeEnd = toD < monthEnd ? toD : monthEnd;
    var overlapDays = Math.round((rangeEnd - rangeStart)/86400000) + 1;
    if(overlapDays < 0) overlapDays = 0;
    var monthTotal = 0;
    state.fixedCosts.forEach(function(fc){ monthTotal += fixedCostForMonth(fc, ym); });
    total += monthTotal * (overlapDays / mDays);
  });
  return total;
}
function totalKmInRange(from,to){
  var t=0;
  Object.keys(state.dailyMeta).forEach(function(d){ if(inRange(d,from,to)) t += (+state.dailyMeta[d].km||0); });
  return t;
}
function totalHoursInRange(from,to){
  var t=0; var today=todayStr();
  Object.keys(state.dailyMeta).forEach(function(d){
    if(inRange(d,from,to)){
      var m = state.dailyMeta[d];
      var wm = m.workedMs!=null? m.workedMs : (m.hours? m.hours*3600000:0);
      if(d===today && m.segmentStart) wm += (Date.now()-m.segmentStart);
      t += wm/3600000;
    }
  });
  return t;
}
function totalBreakHoursInRange(from,to){
  var t=0; var today=todayStr();
  Object.keys(state.dailyMeta).forEach(function(d){
    if(inRange(d,from,to)){
      var m = state.dailyMeta[d];
      var bm = m.breakMs||0;
      if(d===today && m.onBreak && m.breakStart) bm += (Date.now()-m.breakStart);
      t += bm/3600000;
    }
  });
  return t;
}
function workingDaysInRange(from,to){
  var days = {};
  state.records.forEach(function(r){ if(inRange(r.date,from,to)) days[r.date]=true; });
  Object.keys(state.dailyMeta).forEach(function(d){
    if(inRange(d,from,to)){
      var m = state.dailyMeta[d];
      if((m.workedMs && m.workedMs>0) || m.activeShiftStart) days[d]=true;
    }
  });
  return Object.keys(days).length;
}
function fuelStatsInRange(from,to){
  var liters=0, cost=0;
  state.expenses.forEach(function(e){ if(e.category==='fuel' && inRange(e.date,from,to)){ liters+=(+e.liters||0); cost+=(+e.amount||0); } });
  return {liters:liters, cost:cost};
}
function breakdownLabel(r){
  var parts=[];
  if(r.subtype) parts.push(r.subtype);
  if(r.subPlatform) parts.push('→'+r.subPlatform);
  if(r.fareType) parts.push(r.fareType);
  if(r.discountTier && r.discountTier!=='原價') parts.push(r.discountTier);
  if(r.payment) parts.push(r.payment);
  if(r.enterpriseDiscount && r.enterpriseDiscount!=='原價') parts.push(r.enterpriseDiscount);
  if(r.estimateType) parts.push(r.estimateType);
  return parts.join(' · ');
}
function subBreakdown(recs){
  var map = {};
  recs.forEach(function(r){
    var def = platformDef(r.platform);
    var detail = breakdownLabel(r);
    var label = detail ? (def.label+' · '+detail) : def.label;
    var val = computeNetRevenue(r)+(+r.tip||0);
    if(!map[label]) map[label]={count:0,total:0};
    map[label].count++; map[label].total+=val;
  });
  return Object.keys(map).map(function(k){return {label:k,count:map[k].count,total:map[k].total};}).sort(function(a,b){return b.total-a.total;});
}
function weekRange(){
  var t = new Date();
  var day = (t.getDay()+6)%7;
  var mon = new Date(t); mon.setDate(t.getDate()-day);
  var sun = new Date(mon); sun.setDate(mon.getDate()+6);
  return {from:toDateStr(mon), to:toDateStr(sun)};
}
function monthRange(m){
  var y=m.getFullYear(), mo=m.getMonth();
  var from = y+'-'+pad(mo+1)+'-01';
  var last = new Date(y,mo+1,0).getDate();
  var to = y+'-'+pad(mo+1)+'-'+pad(last);
  return {from:from, to:to};
}

    shiftBtn = '<button class="shift-btn stop" data-act="clock-out">下班打卡</button>';

      breakRow = '<div class="daily-row"><span class="l">休息中</span><div style="display:flex;align-items:center;gap:10px"><span class="hours-badge">'+fmtNum(breakH,2)+' 小時</span><button class="shift-btn stop" data-act="break-end">休息結束</button></div></div>';
    } else {
      breakRow = '<div class="daily-row"><span class="l">休息</span><div style="display:flex;align-items:center;gap:10px"><span class="hours-badge">'+fmtNum(breakH,2)+' 小時</span><button class="shift-btn start" data-act="break-start">休息開始</button></div></div>';
    }
  }
  var hoursLabel = (meta.activeShiftStart? (meta.onBreak?'休息中 · ':'營運中 · '):'')+fmtNum(workedH,2)+' 小時';

  h += '<div class="section"><div class="section-title">今日行車</div><div class="card daily-card">';
  h += '<div class="daily-row"><span class="l">今日里程 (km)</span><input class="km-input" type="number" step="0.1" min="0" value="'+(meta.km!=null?meta.km:'')+'" placeholder="0.0" data-km-input></div>';
  h += '<div class="daily-row"><span class="l">工時(已扣休息)</span><div style="display:flex;align-items:center;gap:10px"><span class="hours-badge">'+esc(hoursLabel)+'</span>'+shiftBtn+'</div></div>';
  h += breakRow;
  h += '</div></div>';

  if(todayRecs.length || todayExps.length){
    h += '<div class="section"><div class="section-title">今日明細</div><div class="card">';
    h += renderDayList(t);
    h += '</div></div>';
  }
  return h;
}

function renderDayList(dateStr){
  var recs = state.records.filter(function(r){return r.date===dateStr;}).sort(function(a,b){return b.ts-a.ts;});
  var exps = state.expenses.filter(function(e){return e.date===dateStr;}).sort(function(a,b){return b.ts-a.ts;});
  if(!recs.length && !exps.length) return '<div class="empty-state"><div class="ic">🗒️</div><div class="t">這天還沒有記錄</div></div>';
  var h='';
  recs.forEach(function(r){
    var net = computeNetRevenue(r);
    var grossEst = computeGrossRevenue(r);
    var fee = grossEst-net;
    var amt = net+(+r.tip||0);
    var desc = describeRecord(r);
    var parts = [];
    if(desc) parts.push(esc(desc));
    if(grossEst) parts.push('車資 '+fmtMoney(grossEst));
    if(fee>0.5) parts.push('抽成 '+fmtMoney(fee));
    if(r.tip) parts.push('小費 '+fmtMoney(r.tip));
    if(r.note) parts.push(esc(r.note));
    var subLine = parts.join(' · ');
    h += '<div class="list-item">'+
      '<div class="li-icon" style="background:var(--income-soft);color:var(--income)">🚕</div>'+
      '<div class="li-body" data-act="edit-income:'+r.id+'" style="cursor:pointer"><div class="li-title">'+esc(platformDef(r.platform).label)+'</div><div class="li-sub">'+subLine+'</div></div>'+
      '<div class="li-amt income num">+'+fmtMoney(amt)+'</div>'+
      '<button class="li-del" data-act="del-income:'+r.id+'">✕</button></div>';
  });
  exps.forEach(function(e){
    var ci = catInfo(e.category);
    h += '<div class="list-item">'+
      '<div class="li-icon" style="background:var(--expense-soft)">'+ci.icon+'</div>'+
      '<div class="li-body" data-act="edit-expense:'+e.id+'" style="cursor:pointer"><div class="li-title">'+ci.label+'</div><div class="li-sub">'+(e.category==='fuel'&&e.liters?(fmtNum(e.liters,2)+' 公升 · '):'')+(e.note?esc(e.note):'')+'</div></div>'+
      '<div class="li-amt expense num">-'+fmtMoney(e.amount)+'</div>'+
      '<button class="li-del" data-act="del-expense:'+e.id+'">✕</button></div>';
  });
  return h;
}

/* ---------- HISTORY TAB ---------- */
function renderHistory(){
  var y=uiMonth.getFullYear(), mo=uiMonth.getMonth();
  var first = new Date(y,mo,1);
  var startOffset = (first.getDay()+6)%7;
  var daysInMonth = new Date(y,mo+1,0).getDate();
  var t = todayStr();

  var netByDay = {};
  state.records.forEach(function(r){ if(monthKeyOf(r.date)===y+'-'+pad(mo+1)) netByDay[r.date]=(netByDay[r.date]||0)+computeNetRevenue(r)+(+r.tip||0); });
  state.expenses.forEach(function(e){ if(monthKeyOf(e.date)===y+'-'+pad(mo+1)) netByDay[e.date]=(netByDay[e.date]||0)-(+e.amount||0); });

  var h='';
  h += '<div class="month-nav"><button data-act="month:-1">‹</button><div class="m-title">'+y+' 年 '+(mo+1)+' 月</div><button data-act="month:1">›</button></div>';
  h += '<div class="card"><div class="cal-grid">';
  DOW.forEach(function(d){ h+='<div class="cal-dow">'+d+'</div>'; });
  for(var i=0;i<startOffset;i++) h += '<div class="cal-cell empty"></div>';
  for(var d=1; d<=daysInMonth; d++){
    var ds = y+'-'+pad(mo+1)+'-'+pad(d);
    var net = netByDay[ds];
    var cls = 'cal-cell';
    if(net>0) cls+=' pos'; else if(net<0) cls+=' neg';
    if(ds===t) cls+=' today';
    if(ds===selectedDay) cls+=' selected';
    if(TW_HOLIDAYS[ds]) cls+=' holiday';
    h += '<div class="'+cls+'" data-act="select-day:'+ds+'"><span class="d">'+d+'</span>'+(net?('<span class="n">'+(net>0?'+':'')+fmtNum(net)+'</span>'):'')+'</div>';
  }
  h += '</div></div>';

  var hBlocks = holidayBlocksInMonth(y, mo);
  if(hBlocks.length){
    h += '<div class="card" style="margin-top:8px;padding:10px 14px">';
    h += hBlocks.map(function(b){
      var days = holidayBlockDays(b);
      var fromShort = b.from.slice(5).replace('-','/');
      var toShort = b.to.slice(5).replace('-','/');
      var range = b.from===b.to ? fromShort : (fromShort+'–'+toShort);
      return '<div style="font-size:12px;color:var(--expense);padding:2px 0">🔴 '+range+'　'+esc(b.name)+'('+days+'天)</div>';
    }).join('');
    h += '</div>';
  }

  var histMeta = dm(selectedDay);
  h += '<div class="section" style="margin-top:14px"><div class="card daily-card">'+
    '<div class="daily-row"><span class="l">'+selectedDay+' 里程 (km)</span><input class="km-input" type="number" step="0.1" min="0" value="'+(histMeta.km!=null?histMeta.km:'')+'" placeholder="0.0" data-km-input-date="'+selectedDay+'"></div>'+
    '<div class="daily-row"><span class="l">'+selectedDay+' 工時(小時)</span><input class="km-input" type="number" step="0.01" min="0" value="'+((histMeta.workedMs||0)/3600000).toFixed(2)+'" placeholder="0.00" data-hours-input-date="'+selectedDay+'"></div>'+
    '<div class="daily-row"><span class="l">'+selectedDay+' 休息時間(小時)</span><input class="km-input" type="number" step="0.01" min="0" value="'+((histMeta.breakMs||0)/3600000).toFixed(2)+'" placeholder="0.00" data-break-input-date="'+selectedDay+'"></div>'+
    '<div style="font-size:11px;color:var(--text-muted);line-height:1.5">補記或修改過往的工時/休息時間,直接改數字就會覆蓋掉原本打卡累積的時數。</div>'+
    '</div></div>';

  h += '<div class="section"><div class="section-title">'+selectedDay+' 明細</div><div class="card">'+renderDayList(selectedDay)+'</div></div>';

  h += '<div class="section"><div class="section-title">幫 '+selectedDay+' 補記收入(點明細可修改/刪除)</div><div class="platform-grid">';
  visiblePlatforms().forEach(function(p){
    h += '<div class="platform-chip" data-act="open-income:'+p.key+'"><div class="plat-badge" style="background:'+(p.color||'#8A8272')+'">'+(p.icon||'🚘')+'</div><div class="pname">'+esc(p.label)+'</div></div>';
  });
  h += '</div></div>';
  h += '<div class="section"><div class="section-title">幫 '+selectedDay+' 補記支出</div><div class="expense-grid">';
  CATS.forEach(function(c){
    h += '<div class="expense-chip" data-act="open-expense:'+c.key+'"><div class="eic">'+c.icon+'</div><div class="ename">'+c.label+'</div></div>';
  });
  h += '</div></div>';
  return h;
}

  h += '<div class="stat-tile"><div class="lbl">變動支出</div><div class="val expense num">'+fmtMoney(totalVar)+'</div></div>';

  h += '<div class="stat-tile"><div class="lbl">固定支出(本月)</div><div class="val expense num">'+fmtMoney(fixedTotal)+'</div></div>';

    h += '<div class="section"><div class="section-title">分類佔比</div><div class="card"><div class="donut-legend">';

      h += '<div class="legend-row"><span class="legend-dot" style="background:var(--expense)"></span><span class="lname">'+c.icon+' '+c.label+'</span><span class="lval num">'+fmtMoney(byCat[c.key])+'</span></div>';

  h += '<div class="section"><div class="section-title">明細</div><div class="card">';

      '<div class="li-body"><div class="li-title">'+ci.label+'</div><div class="li-sub">'+e.date+(e.category==='fuel'&&e.liters?(' · '+fmtNum(e.liters,2)+'公升'):'')+(e.note?(' · '+esc(e.note)):'')+'</div></div>'+

  h += '</div></div>';

  h += '<div class="section"><div class="section-title">固定成本清單</div><div class="card">';
  if(state.fixedCosts.length){
    h += state.fixedCosts.map(function(fc){
      var applied = fixedCostForMonth(fc, ym);
      var overridden = state.fixedOverrides[ym] && state.fixedOverrides[ym][fc.id]!=null;
      return '<div class="list-item">'+
        '<div class="li-icon" style="background:var(--surface-sunken)">📌</div>'+
        '<div class="li-body"><div class="li-title">'+esc(fc.name)+'</div><div class="li-sub">'+(fc.freq==='yearly'?('每年 '+fmtMoney(fc.amount)+' · 攤提'):'每月')+(overridden?' · 本月已調整':'')+'</div></div>'+
        '<div class="li-amt expense num" data-act="edit-fixed-override:'+fc.id+'" style="cursor:pointer;text-decoration:underline dotted">-'+fmtMoney(applied)+'</div>'+

  return h;
}

/* ---------- ANALYTICS TAB ---------- */
function renderAnalytics(){
  var range;
  if(analyticsPeriod==='day'){ range={from:analyticsDay,to:analyticsDay}; }
  else if(analyticsPeriod==='week'){ range=weekRange(); }
  else if(analyticsPeriod==='month'){ range=monthRange(uiMonth); }
  else { range = customFrom<=customTo ? {from:customFrom,to:customTo} : {from:customTo,to:customFrom}; }

  var recs = recordsInRange(range.from, range.to);
  var exps = expensesInRange(range.from, range.to);
  var gross = sumIncome(recs);
  var net = sumNetIncome(recs);
  var feeTotal = gross.total-net.total;
  var varExp = sumExpense(exps);
  var fixExp = fixedTotalForRange(range.from, range.to);
  var totalExp = varExp+fixExp;
  var profit = net.total-totalExp;
  var km = totalKmInRange(range.from, range.to);
  var hours = totalHoursInRange(range.from, range.to);
  var breakHours = totalBreakHoursInRange(range.from, range.to);
  var fuel = fuelStatsInRange(range.from, range.to);
  var workDays = workingDaysInRange(range.from, range.to);

  var byPlatform = {};
  recs.forEach(function(r){ byPlatform[r.platform]=(byPlatform[r.platform]||0)+computeNetRevenue(r)+(+r.tip||0); });
  var platformList = Object.keys(byPlatform).map(function(k){return {name:platformDef(k).label, val:byPlatform[k]};}).sort(function(a,b){return b.val-a.val;});
  var palette=['#C97E17','#1E7A4C','#4472C4','#B8402C','#7A5FBF','#2FA0A0','#B8860B','#5A8F7B','#9C5FA8','#4E6E8E','#B08D57','#6E9F3E'];

  var sub = subBreakdown(recs);

  var h='';
  h += '<div class="section"><div class="segmented">'+
    '<button class="'+(analyticsPeriod==='day'?'active':'')+'" data-act="period:day">本日</button>'+
    '<button class="'+(analyticsPeriod==='week'?'active':'')+'" data-act="period:week">本週</button>'+
    '<button class="'+(analyticsPeriod==='month'?'active':'')+'" data-act="period:month">本月</button>'+
    '<button class="'+(analyticsPeriod==='custom'?'active':'')+'" data-act="period:custom">自訂區間</button>'+
    '</div></div>';

  if(analyticsPeriod==='day'){
    h += '<div class="month-nav" style="margin-top:-4px"><button data-act="day:-1">‹</button><div class="m-title"><input type="date" id="dayPicker" value="'+analyticsDay+'" style="background:none;border:none;color:inherit;font:inherit;font-weight:700;text-align:center;width:100%"></div><button data-act="day:1">›</button></div>';
  } else if(analyticsPeriod==='month'){
    h += '<div class="month-nav" style="margin-top:-4px"><button data-act="month:-1">‹</button><div class="m-title">'+uiMonth.getFullYear()+' 年 '+(uiMonth.getMonth()+1)+' 月</div><button data-act="month:1">›</button></div>';
  } else if(analyticsPeriod==='custom'){
    h += '<div class="section"><div class="form-grid2">'+
      '<div class="form-row"><label>起始日期</label><input type="date" id="customFrom" value="'+customFrom+'"></div>'+
      '<div class="form-row"><label>結束日期</label><input type="date" id="customTo" value="'+customTo+'"></div>'+
      '</div></div>';
  }

  h += '<div class="section"><div class="summary-row" style="grid-template-columns:1fr 1fr 1fr">';
  h += '<div class="stat-tile"><div class="lbl">總車資</div><div class="val num">'+fmtMoney(gross.total)+'</div></div>';
  h += '<div class="stat-tile"><div class="lbl">平台手續費</div><div class="val expense num">'+fmtMoney(feeTotal)+'</div></div>';
  h += '<div class="stat-tile"><div class="lbl">實收</div><div class="val income num">'+fmtMoney(net.total)+'</div></div>';
  h += '</div></div>';
  h += '<div class="section"><div class="summary-row" style="grid-template-columns:1fr 1fr">';
  h += '<div class="stat-tile"><div class="lbl">總支出(含固定攤提)</div><div class="val expense num">'+fmtMoney(totalExp)+'</div></div>';
  h += '<div class="stat-tile"><div class="lbl">淨利</div><div class="val num">'+fmtMoney(profit)+'</div></div>';
  h += '</div></div>';

  h += '<div class="section"><div class="section-title">本期概況</div><div class="card"><div class="summary-row" style="grid-template-columns:1fr 1fr">';
  h += '<div class="stat-tile"><div class="lbl">營業天數</div><div class="val num">'+workDays+' 天</div></div>';
  h += '<div class="stat-tile"><div class="lbl">平均日實收</div><div class="val income num">'+(workDays>0?fmtMoney(net.total/workDays):'—')+'</div></div>';
  h += '<div class="stat-tile"><div class="lbl">平均每日工時</div><div class="val num">'+(workDays>0?fmtNum(hours/workDays,2)+' 小時':'—')+'</div></div>';
  h += '<div class="stat-tile"><div class="lbl">平均每日休息時間</div><div class="val num">'+(workDays>0?fmtNum(breakHours/workDays,2)+' 小時':'—')+'</div></div>';
  h += '</div></div></div>';

  h += '<div class="section"><div class="section-title">效率指標</div><div class="card"><div class="summary-row" style="grid-template-columns:1fr 1fr">';
  h += '<div class="stat-tile"><div class="lbl">實際時薪(已扣休息)</div><div class="val num">'+(hours>0?fmtMoney2(net.total/hours):'—')+'</div></div>';
  h += '<div class="stat-tile"><div class="lbl">總工時</div><div class="val num">'+fmtNum(hours,2)+' 小時</div></div>';
  h += '<div class="stat-tile"><div class="lbl">每公里成本</div><div class="val expense num">'+(km>0?fmtMoney2(totalExp/km):'—')+'</div></div>';
  h += '<div class="stat-tile"><div class="lbl">每公里實收</div><div class="val income num">'+(km>0?fmtMoney2(net.total/km):'—')+'</div></div>';
  h += '<div class="stat-tile"><div class="lbl">總里程</div><div class="val num">'+fmtNum(km,1)+' km</div></div>';
  h += '<div class="stat-tile"><div class="lbl">每公升可跑</div><div class="val num">'+(fuel.liters>0?fmtNum(km/fuel.liters,2)+' km':'—')+'</div></div>';
  h += '<div class="stat-tile"><div class="lbl">總休息時間</div><div class="val num">'+fmtNum(breakHours,2)+' 小時</div></div>';
  h += '</div></div></div>';

  if(platformList.length){
    h += '<div class="section"><div class="section-title">平台佔比(實收)</div><div class="card"><div class="donut-legend">';
    platformList.forEach(function(p,i){
      h += '<div class="legend-row"><span class="legend-dot" style="background:'+palette[i%palette.length]+'"></span><span class="lname">'+esc(p.name)+'</span><span class="lval num">'+fmtMoney(p.val)+'</span></div>';
    });
    h += '</div></div></div>';
  }

  if(sub.length){
    h += '<div class="section"><div class="section-title">細項分析(趟次 / 實收)</div><div class="card">';
    h += sub.map(function(s){
      return '<div class="list-item"><div class="li-body"><div class="li-title">'+esc(s.label)+'</div><div class="li-sub">'+s.count+' 趟</div></div><div class="li-amt income num">'+fmtMoney(s.total)+'</div></div>';
    }).join('');
    h += '</div></div>';
  }

  var tg = state.targets;
  var targetVal = analyticsPeriod==='day'?tg.daily : analyticsPeriod==='week'?tg.weekly : analyticsPeriod==='month'?tg.monthly : 0;
  if(targetVal>0){
    var pct = Math.min(100, Math.round(net.total/targetVal*100));
    h += '<div class="section"><div class="section-title">目標進度(依實收計算)</div><div class="card"><div class="progress-wrap">'+
      '<div class="progress-lbl"><span class="p">'+fmtMoney(net.total)+' / '+fmtMoney(targetVal)+'</span><span class="v num">'+pct+'%</span></div>'+
      '<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%"></div></div></div></div></div>';
  }

  return h;
}

/* ---------- MODALS ---------- */
var currentIncomeModalKey = null;
function openModal(html){
  currentIncomeModalKey = null;
  var root = document.getElementById('modalRoot');
  root.innerHTML = '<div class="modal-overlay" data-act="close-modal"><div class="modal" id="modalBody" data-act="noop"></div></div>';

function computePreviewRecordFromForm(key){
  var def = platformDef(key);
  function grab(id){ var el=document.getElementById(id); return el?el.value:null; }
  var rec = {platform:key};
  rec.revenue = +grab('f-revenue')||0;
  rec.tip = +grab('f-tip')||0;
  if(def.fareTypeOptions){ var fte=document.getElementById('chip-fareType'); rec.fareType = fte?fte.value:def.fareTypeOptions[0]; }
  if(def.paymentOptions){ var pe=document.getElementById('chip-payment'); rec.payment = pe?pe.value:def.paymentOptions[0]; }
  if(def.discountOptions){ var de=document.getElementById('chip-discountTier'); rec.discountTier = de?de.value:def.discountOptions[0]; }
  if(def.enterpriseDiscountOptions){ var ee=document.getElementById('chip-enterpriseDiscount'); rec.enterpriseDiscount = ee?ee.value:def.enterpriseDiscountOptions[0]; }
  if(def.hasStationFee){ rec.stationFee = +grab('f-station-fee')||0; }
  return rec;
}
function updateIncomePreview(){
  if(!currentIncomeModalKey) return;
  var el = document.getElementById('incomePreview');
  if(!el) return;
  var def = platformDef(currentIncomeModalKey);
  if(def.tipOnly){ return; }
  var rec = computePreviewRecordFromForm(currentIncomeModalKey);
  var net = computeNetRevenue(rec);
  var gross = computeGrossRevenue(rec);
  var fee = gross-net;
  var total = net+rec.tip;
  el.innerHTML = '<div class="summary-row" style="grid-template-columns:1fr 1fr 1fr">'+
    '<div class="stat-tile"><div class="lbl">車資</div><div class="val num">'+fmtMoney(gross)+'</div></div>'+
    '<div class="stat-tile"><div class="lbl">抽成</div><div class="val expense num">'+(fee>0.5?fmtMoney(fee):'—')+'</div></div>'+
    '<div class="stat-tile"><div class="lbl">實收</div><div class="val income num">'+fmtMoney(total)+'</div></div>'+
    '</div>';
}

function chipRowHtml(groupId, options, selectedDefault){
  var h = '<div class="chip-row" data-group="'+groupId+'">';
  options.forEach(function(opt){
    var sel = opt===selectedDefault ? ' selected' : '';

function saveIncome(key, editId){
  var def = platformDef(key);
  function grab(id){ var el=document.getElementById(id); return el? el.value : null; }
  var revenue = +grab('f-revenue') || 0;
  var tip = +grab('f-tip') || 0;
  var note = (grab('f-note')||'').trim();
  if(revenue<=0 && tip<=0){ closeModal(); return; }
  var existing = editId ? state.records.filter(function(r){return r.id===editId;})[0] : null;
  var rec = existing || {id:uid(), date:currentEntryDate(), ts:Date.now(), platform:key};
  rec.revenue = revenue; rec.tip = tip; rec.note = note;
  if(def.subtypeOptions) rec.subtype = grab('chip-subtype');
  if(def.fareTypeOptions) rec.fareType = grab('chip-fareType');
  if(def.discountOptions) rec.discountTier = grab('chip-discountTier');
  var meterLike = !def.fareTypeOptions || rec.fareType==='跳表' || rec.fareType==='固定價';
  if(def.paymentOptions && meterLike) rec.payment = grab('chip-payment'); else if(def.paymentOptions) rec.payment = undefined;
  if(def.enterpriseDiscountOptions && rec.payment==='企業簽單') rec.enterpriseDiscount = grab('chip-enterpriseDiscount'); else if(def.enterpriseDiscountOptions) rec.enterpriseDiscount = undefined;
  if(def.hasStationFee && rec.fareType==='據點叫車'){ var sf=grab('f-station-fee'); rec.stationFee = (sf!=null && sf!=='') ? +sf : undefined; } else if(def.hasStationFee) rec.stationFee = undefined;
  if(def.estimateTypeOptions && rec.fareType==='預估車資') rec.estimateType = grab('chip-estimateType'); else if(def.estimateTypeOptions) rec.estimateType = undefined;
  var ma = grab('f-markup-amount'); rec.markupAmount = (ma!=null && ma!=='') ? +ma : undefined;
  var mm = grab('f-markup-multiplier'); rec.markupMultiplier = (mm!=null && mm!=='') ? +mm : undefined;
  if(def.subPlatformOptions) rec.subPlatform = grab('f-subplatform');
  if(!existing) state.records.push(rec);
  save(); syncIncomeRecord(rec); closeModal(); renderAll();
}

    handle.addEventListener('pointerdown', function(e){
      e.preventDefault();
      var dragEl = handle.closest('.plat-row');
      dragEl.classList.add('dragging');
      try{ dragEl.setPointerCapture(e.pointerId); }catch(err){}
      function onMove(ev){
        var others = rows().filter(function(r){ return r!==dragEl; });
        var placed = false;
        for(var i=0;i<others.length;i++){
          var rect = others[i].getBoundingClientRect();
          var mid = rect.top+rect.height/2;
          if(ev.clientY < mid){ list.insertBefore(dragEl, others[i]); placed=true; break; }
        }
        if(!placed) list.appendChild(dragEl);
      }
      function onUp(ev){
        dragEl.classList.remove('dragging');
        try{ dragEl.releasePointerCapture(ev.pointerId); }catch(err){}
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        state.platformOrder = rows().map(function(r){ return r.getAttribute('data-key'); });
        save();
      }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  });
}
function openExportModal(){
  var json = JSON.stringify(state);
  var h = '<div class="modal-title">匯出備份<button class="close" data-act="close-modal">✕</button></div>';
  h += '<div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;line-height:1.6">按下面「複製」把下方文字整段複製起來,傳給自己(例如 LINE 傳給自己或用備忘錄),再到另一個瀏覽器/裝置的「匯入還原」貼上即可。</div>';
  h += '<textarea id="exportText" readonly style="width:100%;height:160px;font-size:11px;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--surface-sunken);color:var(--text);box-sizing:border-box" onclick="this.focus();this.select()">'+esc(json)+'</textarea>';
  h += '<div class="btn-row" style="margin-top:10px"><button class="btn btn-primary" data-act="copy-export">複製到剪貼簿</button></div>';
  h += '<div id="exportCopyStatus" style="font-size:12px;color:var(--text-muted);margin-top:8px;text-align:center"></div>';
  openModal(h);
}
function copyExportText(){
  var ta = document.getElementById('exportText');
  var statusEl = document.getElementById('exportCopyStatus');
  if(!ta) return;
  ta.focus(); ta.select();
  function ok(){ if(statusEl) statusEl.textContent = '已複製!'; }
  function fail(){ if(statusEl) statusEl.textContent = '自動複製失敗,請手動長按文字選取後複製。'; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(ok, fail);
  } else {
    try{ document.execCommand('copy') ? ok() : fail(); }catch(err){ fail(); }
  }
}
function openImportModal(){
  var h = '<div class="modal-title">匯入還原<button class="close" data-act="close-modal">✕</button></div>';
  h += '<div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;line-height:1.6">把之前「匯出備份」複製的整段文字貼在下面,按還原。<b style="color:var(--expense)">注意:這會覆蓋掉目前這個瀏覽器裡的所有資料</b>,請確認來源沒錯再按。</div>';
  h += '<textarea id="importText" placeholder="貼上備份文字…" style="width:100%;height:160px;font-size:11px;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--surface-sunken);color:var(--text);box-sizing:border-box"></textarea>';
  h += '<div class="btn-row" style="margin-top:10px"><button class="btn btn-danger" data-act="do-import">還原這份資料</button></div>';
  openModal(h);
}
function doImportData(){
  var ta = document.getElementById('importText');
  if(!ta || !ta.value.trim()){ alert('請先貼上備份文字。'); return; }
  var parsed;
  try{ parsed = JSON.parse(ta.value.trim()); }catch(err){ alert('這段文字看起來不是有效的備份資料,請確認有整段複製完整。'); return; }
  if(!parsed || typeof parsed!=='object' || !Array.isArray(parsed.records)){ alert('這段文字看起來不是有效的備份資料。'); return; }
  if(!confirm('確定要用這份備份覆蓋掉目前的所有資料嗎?此動作無法復原。')) return;
  var d = defaultState();
  for(var k in d){ if(!(k in parsed)) parsed[k]=d[k]; }
  state = parsed;
  save(); closeModal(); renderAll();
  alert('資料已還原。');
}
function openNewPlatformModal(){
  var h = '<div class="modal-title">新增平台<button class="close" data-act="close-modal">✕</button></div>';
  h += '<div class="form-row"><label>平台名稱</label><input id="f-newplat-name" type="text" placeholder="例如:企業合作單"></div>';
  h += '<div class="form-row"><label>屬性選項(選填,用逗號分隔,例如:一般,加大)</label><input id="f-newplat-tags" type="text" placeholder=""></div>';
  h += '<div class="btn-row"><button class="btn btn-primary" data-act="save-newplatform">新增</button></div>';
  openModal(h);
  setTimeout(function(){ var el=document.getElementById('f-newplat-name'); if(el) el.focus(); }, 50);
}
function saveNewPlatform(){
  var name = document.getElementById('f-newplat-name').value.trim();
  var tagsRaw = document.getElementById('f-newplat-tags').value.trim();
  if(!name){ closeModal(); return; }
  var customPalette = ['#C97E17','#2F80ED','#7FBF3F','#D9704A','#7A5FBF','#2FA0A0'];
  var cIdx = (state.customPlatforms||[]).length % customPalette.length;
  var cp = {key:'custom_'+uid(), label:name, hidden:false, icon:'🚘', color:customPalette[cIdx]};
  if(tagsRaw) cp.subtypeOptions = tagsRaw.split(',').map(function(s){return s.trim();}).filter(function(s){return s;});
  state.customPlatforms.push(cp);
  if(!state.platformOrder) state.platformOrder=[];
  state.platformOrder.push(cp.key);
  save(); openSettingsModal();
}
function savePlatformSettings(){
  var list = document.getElementById('platOrderList');
  if(list){ state.platformOrder = Array.prototype.slice.call(list.children).map(function(r){ return r.getAttribute('data-key'); }); }
  allPlatforms().forEach(function(p){
    var nameEl = document.getElementById('f-plat-name-'+p.key);
    var hiddenEl = document.getElementById('f-plat-hidden-'+p.key);
    var iconEl = document.getElementById('f-plat-icon-'+p.key);
    var colorEl = document.getElementById('f-plat-color-'+p.key);
    if(!nameEl || !hiddenEl) return;
    var name = nameEl.value.trim() || p.label;
    var hidden = hiddenEl.checked;
    var icon = iconEl ? (iconEl.value.trim()||p.icon) : p.icon;
    var color = colorEl ? colorEl.value : p.color;
    if(p.custom){
      var cp = state.customPlatforms.filter(function(c){return c.key===p.key;})[0];
      if(cp){ cp.label=name; cp.hidden=hidden; cp.icon=icon; cp.color=color; }
    } else {
      state.platformOverrides[p.key] = {label:name, hidden:hidden, icon:icon, color:color};
    }
  });
}
function saveSettings(){
  savePlatformSettings();
  state.targets.daily = +document.getElementById('f-target-daily').value || 0;
  state.targets.weekly = +document.getElementById('f-target-weekly').value || 0;
  state.targets.monthly = +document.getElementById('f-target-monthly').value || 0;
  function g(id){ var v=document.getElementById(id).value; return v===''?null:+v; }
  state.feeRules.tdc = g('f-fee-tdc');
  state.feeRules.yoxiCash = g('f-fee-yoxicash');
  state.feeRules.yoxiCreditExtra = g('f-fee-yoxicreditextra');
  state.feeRules.linego = g('f-fee-linego');
  state.feeRules.metroFlat = g('f-fee-metroflat');
  state.feeRules.metroCredit = g('f-fee-metrocredit');
  state.feeRules.metroEnterprise = g('f-fee-metroenterprise');
  state.feeRules.uber = g('f-fee-uber');
  state.feeRules.boltFlat = g('f-fee-boltflat');
  state.feeRules.boltPct = g('f-fee-boltpct');
  state.feeRules.boltThreshold = g('f-fee-boltthreshold');
  state.feeRules.boltThresholdEnabled = document.getElementById('f-fee-boltthresholdenabled').checked;
  state.syncUrl = document.getElementById('f-sync-url').value.trim();
  save(); closeModal(); renderAll();
}

/* ---------- EVENT DELEGATION ---------- */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]');
  if(!t) return;
  var act = t.getAttribute('data-act');
  var parts = act.split(':');
  var cmd = parts[0], arg = parts.slice(1).join(':');

  if(cmd==='tab'){ currentTab=arg; renderAll(); }
  else if(cmd==='noop'){ /* absorb click inside modal card */ }
  else if(cmd==='close-modal'){ closeModal(); }
  else if(cmd==='open-income'){ openIncomeModal(arg); }
  else if(cmd==='save-income'){ var si=arg.split(':'); saveIncome(si[0], si[1]); }
  else if(cmd==='open-expense'){ openExpenseModal(arg); }
  else if(cmd==='save-expense'){ var se=arg.split(':'); saveExpense(se[0], se[1]); }
  else if(cmd==='del-income'){ state.records=state.records.filter(function(r){return r.id!==arg;}); save(); renderAll(); }
  else if(cmd==='del-expense'){ state.expenses=state.expenses.filter(function(r){return r.id!==arg;}); save(); renderAll(); }
  else if(cmd==='del-income-close'){ state.records=state.records.filter(function(r){return r.id!==arg;}); save(); closeModal(); renderAll(); }
  else if(cmd==='del-expense-close'){ state.expenses=state.expenses.filter(function(r){return r.id!==arg;}); save(); closeModal(); renderAll(); }
  else if(cmd==='edit-income'){
    var recToEdit = state.records.filter(function(r){return r.id===arg;})[0];
    if(recToEdit) openIncomeModal(recToEdit.platform, arg);
  }
  else if(cmd==='edit-expense'){
    var expToEdit = state.expenses.filter(function(e){return e.id===arg;})[0];
    if(expToEdit) openExpenseModal(expToEdit.category, arg);
  }
  else if(cmd==='clock-in'){
    var staleDate1 = findStaleOpenShiftDate();
    if(staleDate1){ openStaleShiftModal(staleDate1); return; }
    var m1 = dm(todayStr()); m1.activeShiftStart=Date.now(); m1.segmentStart=Date.now(); m1.onBreak=false; save(); renderAll();
  }
  else if(cmd==='save-stale-shift'){
    var staleVal = document.getElementById('f-stale-endtime').value;
    if(!staleVal){ alert('請選擇下班時間。'); return; }
    var staleEndTs = new Date(staleVal).getTime();
    var staleMeta = state.dailyMeta[arg];
    var staleStartRef = (staleMeta.onBreak && staleMeta.breakStart) ? staleMeta.breakStart : staleMeta.segmentStart;
    if(!staleStartRef || isNaN(staleEndTs) || staleEndTs<=staleStartRef){ alert('下班時間必須晚於上班(或上次恢復工作)的時間,請重新選擇。'); return; }
    finalizeStaleShift(arg, staleEndTs);
    var nextStale = findStaleOpenShiftDate();
    if(nextStale){ openStaleShiftModal(nextStale); } else { closeModal(); }
  }
  else if(cmd==='clock-out'){
    var m2 = dm(todayStr());
    if(m2.onBreak && m2.breakStart){ m2.breakMs += (Date.now()-m2.breakStart); m2.breakStart=null; m2.onBreak=false; }
    if(m2.segmentStart){ m2.workedMs += (Date.now()-m2.segmentStart); m2.segmentStart=null; }
    m2.activeShiftStart=null;
    save(); syncDailyRecord(todayStr()); renderAll();
  }
  else if(cmd==='break-start'){
    var m3 = dm(todayStr());
    if(m3.activeShiftStart && !m3.onBreak && m3.segmentStart){
      m3.workedMs += (Date.now()-m3.segmentStart); m3.segmentStart=null; m3.onBreak=true; m3.breakStart=Date.now();
      save(); renderAll();
    }
  }
  else if(cmd==='break-end'){
    var m4 = dm(todayStr());
    if(m4.onBreak && m4.breakStart){
      m4.breakMs += (Date.now()-m4.breakStart); m4.breakStart=null; m4.onBreak=false; m4.segmentStart=Date.now();
      save(); syncDailyRecord(todayStr()); renderAll();
    }
  }
  else if(cmd==='month'){ uiMonth.setMonth(uiMonth.getMonth()+(+arg)); renderAll(); }
  else if(cmd==='day'){ var dObj=new Date(analyticsDay+'T00:00:00'); dObj.setDate(dObj.getDate()+(+arg)); analyticsDay=toDateStr(dObj); renderAll(); }
  else if(cmd==='select-day'){ selectedDay=arg; renderAll(); }
  else if(cmd==='period'){ analyticsPeriod=arg; renderAll(); }
  else if(cmd==='open-fixed-new'){ openFixedModal(); }
  else if(cmd==='save-fixed'){ saveFixed(); }
  else if(cmd==='del-fixed'){ state.fixedCosts=state.fixedCosts.filter(function(f){return f.id!==arg;}); save(); renderAll(); }
  else if(cmd==='edit-fixed-override'){ openFixedOverrideModal(arg); }
  else if(cmd==='save-fixed-override'){ saveFixedOverride(arg); }
  else if(cmd==='reset-fixed-override'){ resetFixedOverride(arg); }
  else if(cmd==='rename-app'){ openRenameModal(); }
  else if(cmd==='save-appname'){ saveAppName(); }
  else if(cmd==='open-settings'){ openSettingsModal(); }
  else if(cmd==='open-newplatform'){ openNewPlatformModal(); }
  else if(cmd==='save-newplatform'){ saveNewPlatform(); }
  else if(cmd==='del-platform'){ state.customPlatforms = state.customPlatforms.filter(function(c){return c.key!==arg;}); save(); openSettingsModal(); }
  else if(cmd==='save-settings'){ saveSettings(); }
  else if(cmd==='sync-all'){
    if(!state.syncUrl){ alert('請先在上面填入 Google Sheet 同步網址,再按儲存設定。'); return; }
    var statusEl = document.getElementById('syncStatus');
    syncAllData(
      function(done,total){ if(statusEl) statusEl.textContent = '同步中… '+done+' / '+total; },
      function(total){ if(statusEl) statusEl.textContent = '已送出 '+total+' 筆,請到 Google Sheet 確認資料是否進來。'; }
    );
  }
  else if(cmd==='open-export'){ openExportModal(); }
  else if(cmd==='copy-export'){ copyExportText(); }
  else if(cmd==='open-import'){ openImportModal(); }
  else if(cmd==='do-import'){ doImportData(); }
  else if(cmd==='reset-all'){
    if(confirm('確定要清除所有記帳資料嗎?此動作無法復原。')){ state=defaultState(); save(); closeModal(); renderAll(); }
  }
  else if(cmd==='chip'){
    var gv0 = arg.indexOf(':');
    var groupId = gv0>=0 ? arg.slice(0,gv0) : arg;
    var value = gv0>=0 ? arg.slice(gv0+1) : '';
    document.querySelectorAll('[data-group="'+groupId+'"]').forEach(function(b){
      b.classList.toggle('selected', b.getAttribute('data-act')==='chip:'+groupId+':'+value);
    });
    var hi = document.getElementById('chip-'+groupId);
    if(hi) hi.value = value;
    if(groupId==='fareType'){
      var meterEl = document.getElementById('sec-meterExtra');
      var estEl = document.getElementById('sec-estimateExtra');
      var stationEl = document.getElementById('sec-stationFee');
      var meterLike = (value==='跳表' || value==='固定價');
      var estLike = (value==='預估車資');
      var stationLike = (value==='據點叫車');
      if(meterEl) meterEl.hidden = !meterLike;
      if(estEl) estEl.hidden = !estLike;
      if(stationEl) stationEl.hidden = !stationLike;
      var discEl0 = document.getElementById('sec-yoxi-enterprise-discount');
      if(discEl0 && !meterLike) discEl0.hidden = true;
    }
    if(groupId==='payment'){
      var discEl = document.getElementById('sec-yoxi-enterprise-discount');
      if(discEl) discEl.hidden = (value!=='企業簽單');
    }
    updateIncomePreview();
  }
});
document.addEventListener('input', function(e){
  if(currentIncomeModalKey && e.target.closest && e.target.closest('#modalBody')){
    updateIncomePreview();
  }
});
document.addEventListener('change', function(e){
  if(e.target.matches('[data-km-input]')){
    dm(todayStr()).km = e.target.value===''? null : +e.target.value;
    save(); syncDailyRecord(todayStr());
  }
  else if(e.target.matches('[data-km-input-date]')){
    var kd = e.target.getAttribute('data-km-input-date');
    dm(kd).km = e.target.value===''? null : +e.target.value;
    save(); syncDailyRecord(kd);
  }
  else if(e.target.matches('[data-hours-input-date]')){
    var hd = e.target.getAttribute('data-hours-input-date');
    var mh = dm(hd);
    mh.workedMs = Math.max(0, (e.target.value===''?0:+e.target.value)*3600000);
    save(); syncDailyRecord(hd);
  }
  else if(e.target.matches('[data-break-input-date]')){
    var bd = e.target.getAttribute('data-break-input-date');
    var mb = dm(bd);
    mb.breakMs = Math.max(0, (e.target.value===''?0:+e.target.value)*3600000);
    save(); syncDailyRecord(bd);
  }
  else if(e.target.id==='dayPicker'){ if(e.target.value){ analyticsDay = e.target.value; renderAll(); } }
  else if(e.target.id==='customFrom'){ if(e.target.value){ customFrom = e.target.value; renderAll(); } }
  else if(e.target.id==='customTo'){ if(e.target.value){ customTo = e.target.value; renderAll(); } }
});

renderAll();
var _staleShiftDate = findStaleOpenShiftDate();
if(_staleShiftDate) openStaleShiftModal(_staleShiftDate);
})();
